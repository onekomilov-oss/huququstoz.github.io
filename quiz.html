<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Huquq Ustoz</title>
<link rel="icon" type="image/jpeg" href="huquq.jpg">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
body{ background:#0f172a; color:white; min-height:100vh; display:flex; flex-direction:column; }
header{ position:sticky; top:0; background:#111827; padding:15px 0; border-bottom:1px solid #333; z-index:10; }
.container{ width:90%; max-width:1100px; margin:auto; }
.nav{ display:flex; justify-content:space-between; align-items:center; }
.logo{ display:flex; align-items:center; gap:12px; text-decoration:none; }
.logo img{ width:55px; height:55px; border-radius:50%; object-fit:cover; }
.logo h2{ color:#a855f7; font-size:24px; }
.social{ display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
.social a{ text-decoration:none; color:white; padding:10px 18px; border:1px solid #444; border-radius:8px; transition:.3s; }
.social a:hover, .social a.active{ background:#7c3aed; border-color:#7c3aed; }

main{ flex:1; padding:40px 0; }
.quiz-card{ background:#111827; border:1px solid #333; border-radius:12px; padding:30px; max-width:800px; margin:auto; }
.quiz-card h1{ color:#a855f7; margin-bottom:20px; font-size:28px; text-align:center; }

.select-group{ margin-bottom:25px; }
.select-group label{ display:block; margin-bottom:10px; color:#cbd5e1; font-size:16px; }
select{ width:100%; padding:12px 15px; background:#1f2937; border:1px solid #444; color:white; border-radius:8px; font-size:16px; outline:none; }
select:focus{ border-color:#a855f7; }

.question-box{ background:#1f2937; border-radius:10px; padding:20px; margin-bottom:20px; }
.question-title{ font-size:18px; margin-bottom:15px; color:#f3f4f6; }
.options{ display:flex; flex-direction:column; gap:10px; }
.option-btn{ background:#111827; border:1px solid #444; color:white; padding:12px 15px; border-radius:8px; text-align:left; cursor:pointer; font-size:16px; transition:.2s; }
.option-btn:hover{ background:#374151; border-color:#7c3aed; }
.option-btn.selected{ background:#7c3aed; border-color:#a855f7; }

.actions{ display:flex; justify-content:space-between; align-items:center; margin-top:25px; }
.btn{ padding:12px 24px; border-radius:8px; font-weight:bold; cursor:pointer; border:none; color:white; transition:.3s; text-decoration:none; }
.primary{ background:#7c3aed; }
.primary:hover{ background:#6d28d9; }
.secondary{ background:transparent; border:2px solid #7c3aed; }
.secondary:hover{ background:#7c3aed; }

.result-box{ text-align:center; padding:20px; }
.result-box h2{ color:#a855f7; font-size:32px; margin-bottom:15px; }
.result-box p{ font-size:20px; color:#cbd5e1; margin-bottom:25px; }

footer{ padding:25px 0; border-top:1px solid #333; background:#0f172a; color:#9ca3af; margin-top:auto; }
.footer-content{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.admin-link{ color:#64748b; text-decoration:none; font-size:14px; transition:.3s; }
.admin-link:hover{ color:#a855f7; }

@media(max-width:768px){
  .nav{ flex-wrap:wrap; gap:12px; }
  .social{ justify-content:center; width:100%; }
}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo">
      <img src="huquq.jpg" alt="Huquq Ustoz Logo">
      <h2>Huquq Ustoz</h2>
    </a>
    <div class="social">
      <a href="index.html">Bosh sahifa</a>
      <a href="kutubxona.html">Elektron Kutubxona</a>
      <a href="quiz.html" class="active">Quiz</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="quiz-card" id="quiz-container">
    <h1>Huquqiy Quiz Test</h1>
    
    <div class="select-group" id="category-picker">
      <label for="quiz-category">Test toifasini tanlang:</label>
      <select id="quiz-category">
        <option value="" disabled selected>Yuklanmoqda...</option>
      </select>
      <button class="btn primary" style="width:100%; margin-top:15px;" id="start-btn">Testni boshlash</button>
    </div>

    <div id="quiz-body" style="display:none;">
      <div id="questions-wrapper"></div>
      <div class="actions">
        <span id="progress-text" style="color:#9ca3af;">1 / 10</span>
        <button class="btn primary" id="next-btn">Keyingisi</button>
      </div>
    </div>

    <div id="result-screen" class="result-box" style="display:none;">
      <h2>Natijangiz</h2>
      <p id="score-text">0 / 0</p>
      <button class="btn primary" onclick="location.reload()">Qaytadan topshirish</button>
    </div>
  </div>
</main>

<footer>
  <div class="container footer-content">
    <p>© 2026 Huquq Ustoz. Barcha huquqlar himoyalangan.</p>
    <a href="login.html" class="admin-link">⚙️ Admin Paneli</a>
  </div>
</footer>

<script src="scripts/app.js"></script>
</body>
</html>
