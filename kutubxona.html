<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elektron Kutubxona | Huquq Ustoz</title>

<meta name="description" content="Huquqshunoslik bo'yicha darsliklar va elektron o'quv materiallari.">
<link rel="icon" type="image/jpeg" href="huquq.jpg">

<!-- FontAwesome Ikonkalar Kutubxonasi -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ZAMONAVIY GLASSMORPHISM DIZAYN */
:root {
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-hover: rgba(255, 255, 255, 0.08);
  --primary-purple: #8b5cf6;
  --accent-cyan: #06b6d4;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* NAVIGATION HEADER */
header {
  position: sticky;
  top: 0;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
  padding: 16px 0;
  z-index: 1000;
}

.container {
  width: 90%;
  max-width: 1150px;
  margin: auto;
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
}

.logo img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--primary-purple);
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
}

.logo h2 {
  background: linear-gradient(135deg, #a78bfa, var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.social {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.nav-link {
  text-decoration: none;
  color: var(--text-main);
  padding: 10px 18px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 14px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.nav-link i {
  color: #a78bfa;
}

.nav-link:hover, .nav-link.active {
  background: var(--glass-hover);
  border-color: var(--primary-purple);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139, 92, 246, 0.25);
}

.nav-link.active {
  background: rgba(139, 92, 246, 0.2);
}

/* PAGE HEADER */
.page-head {
  padding: 60px 20px 20px;
  text-align: center;
}

.page-head h1 {
  font-size: 42px;
  font-weight: 800;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.page-head p {
  color: var(--text-muted);
  font-size: 18px;
}

/* SEARCH INPUT */
.search-wrap {
  display: flex;
  justify-content: center;
  padding: 20px 20px 10px;
}

.search-box {
  position: relative;
  width: 100%;
  max-width: 480px;
}

.search-box i {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
}

.search-box input {
  width: 100%;
  padding: 14px 16px 14px 48px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  color: white;
  font-size: 16px;
  outline: none;
  transition: all 0.3s ease;
}

.search-box input:focus {
  border-color: var(--primary-purple);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
  background: rgba(255, 255, 255, 0.07);
}

/* BOOKS GRID & CARDS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 28px;
  padding: 40px 20px 90px;
  max-width: 1150px;
  margin: auto;
  width: 90%;
}

.card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.card:hover {
  transform: translateY(-6px);
  border-color: var(--primary-purple);
  box-shadow: 0 15px 30px rgba(139, 92, 246, 0.2);
}

.card .cover {
  width: 100%;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: rgba(30, 41, 59, 0.5);
  position: relative;
}

.card .cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}

.card:hover .cover img {
  transform: scale(1.05);
}

.card-body {
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-body h3 {
  font-size: 16px;
  line-height: 1.4;
  margin-bottom: 10px;
  color: #f8fafc;
  font-weight: 600;
}

.card-body .meta {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 12px;
  line-height: 1.4;
}

.card-body .genre {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  background: rgba(139, 92, 246, 0.15);
  border: 1px solid rgba(139, 92, 246, 0.3);
  color: #c084fc;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 18px;
  font-weight: 500;
}

.read-btn {
  margin-top: auto;
  text-align: center;
  text-decoration: none;
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  color: white;
  padding: 12px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.25);
}

.read-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
}

.empty {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 20px;
  grid-column: 1 / -1;
  font-size: 18px;
}

/* FOOTER */
footer {
  margin-top: auto;
  padding: 25px 0;
  text-align: center;
  border-top: 1px solid var(--glass-border);
  background: rgba(15, 23, 42, 0.9);
  color: var(--text-muted);
  font-size: 14px;
}

/* RESPONSIVE DESIGN */
@media(max-width: 768px) {
  .logo h2 { font-size: 20px; }
  .page-head h1 { font-size: 30px; }
  .nav { flex-direction: column; gap: 15px; }
  .social { width: 100%; justify-content: center; }
  .nav-link { padding: 8px 12px; font-size: 13px; }
}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="logo" href="index.html">
      <img src="huquq.jpg" alt="Huquq Ustoz Logo">
      <h2>Huquq Ustoz</h2>
    </a>
    <div class="social">
      <a href="kutubxona.html" class="nav-link active">
        <i class="fa-solid fa-book-open"></i>
        <span>Elektron Kutubxona</span>
      </a>
      <a href="quiz.html" class="nav-link">
        <i class="fa-solid fa-circle-question"></i>
        <span>Quiz</span>
      </a>
      <a href="https://instagram.com/huququstoz" target="_blank" class="nav-link">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </a>
      <a href="https://t.me/huququstoz" target="_blank" class="nav-link">
        <i class="fa-brands fa-telegram"></i>
        <span>Telegram</span>
      </a>
    </div>
  </div>
</header>

<section class="page-head">
  <h1>Elektron Kutubxona</h1>
  <p>Huquqshunoslik bo'yicha darsliklar va o'quv materiallari</p>
</section>

<div class="search-wrap">
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Kitob nomi yoki sinf bo'yicha qidirish...">
  </div>
</div>

<section class="grid" id="booksGrid"></section>

<footer>
  © 2026 Huquq Ustoz. Barcha huquqlar himoyalangan.
</footer>

<script>
const books = [
  {
    title: "O'ZBEKISTON DAVLATI VA HUQUQI ASOSLARI",
    meta: "\"Huquq va Jamiyat\" nashriyoti, Toshkent — 2019",
    genre: "8-sinf darsligi",
    cover: "8-sinf.png",
    driveLink: "https://drive.google.com/file/d/1iJSyVPBEuGwNSYBO9cIqC_Q4V_K_XvcC/view?usp=sharing"
  },
  {
    title: "KONSTITUTSIYAVIY HUQUQ ASOSLARI",
    meta: "«SHARQ» nashriyot-matbaa aksiyadorlik kompaniyasi, Toshkent — 2019",
    genre: "9-sinf darsligi",
    cover: "9-sinf%20.png",
    driveLink: "https://drive.google.com/file/d/1xYBYuR1bjwQeme4TtKVIsgSl1JPRtYau/view?usp=sharing"
  },
  {
    title: "DAVLAT VA HUQUQ ASOSLARI",
    meta: "«Yangiyo'l Poligraf Servis», Toshkent — 2017",
    genre: "10-sinf darsligi",
    cover: "10-sinf.png",
    driveLink: "https://drive.google.com/file/d/1RcyhKuHv5xQg0EUQy_pb62TPqV4N51oa/view?usp=sharing"
  },
  {
    title: "DAVLAT VA HUQUQ ASOSLARI",
    meta: "«Yangiyul Poligraph Service», Toshkent — 2018",
    genre: "11-sinf darsligi",
    cover: "11-sinf.png",
    driveLink: "https://drive.google.com/file/d/1RBl1J9zqTnarkO11MpLI0rQJMpTga1a3/view?usp=sharing"
  }
];

const grid = document.getElementById('booksGrid');
const searchInput = document.getElementById('searchInput');

function renderBooks(list){
  grid.innerHTML = "";
  if(list.length === 0){
    grid.innerHTML = '<p class="empty"><i class="fa-solid fa-folder-open"></i> Hech narsa topilmadi.</p>';
    return;
  }
  list.forEach(book => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cover">
        <img src="${book.cover}" alt="${book.title}">
      </div>
      <div class="card-body">
        <h3>${book.title}</h3>
        <div class="meta">${book.meta}</div>
        <span class="genre"><i class="fa-solid fa-bookmark"></i> ${book.genre}</span>
        <a class="read-btn" href="${book.driveLink}" target="_blank" rel="noopener">
          <i class="fa-solid fa-book-reader"></i> O'qish
        </a>
      </div>
    `;
    grid.appendChild(card);
  });
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = books.filter(b =>
    b.title.toLowerCase().includes(q) ||
    b.genre.toLowerCase().includes(q) ||
    b.meta.toLowerCase().includes(q)
  );
  renderBooks(filtered);
});

renderBooks(books);
</script>
</body>
</html>
