    { term: "Sud ijrochisi", definition: "Sud qarorlari va boshqa ijro hujjatlarini majburiy ijro etish vazifasini bajaruvchi mansabdor shaxs.", source: "Sud ijrochilari to'g'risidagi qonun" },
    { term: "Da'vo ta'minoti", definition: "Sud qarori ijro etilishini kafolatlash maqsadida da'vo ko'rilayotgan davrda qo'llaniladigan vaqtinchalik chora.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Ish yuritishni to'xtatib turish", definition: "Sudning ob'ektiv sabablarga ko'ra ishni ko'rib chiqishni vaqtincha to'xtatishi.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Sudlov", definition: "Muayyan ishni ko'rib chiqish qaysi sudning vakolatiga tegishli ekanligini belgilovchi qoidalar majmui.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Taalluqlilik (podsudnost)", definition: "Ish qaysi bosqich yoki hududdagi sud tomonidan ko'rilishi lozimligini belgilovchi qoida.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Mировая bitim (sulh bitimi)", definition: "Taraflarning nizoni sud jarayonida o'zaro kelishuv yo'li bilan hal etishi.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Sud ajrimi", definition: "Fuqarolik ishi bo'yicha ishni mohiyati bo'yicha hal qilmasdan chiqariladigan protsessual qaror.", source: "Fuqarolik protsessual kodeksi" },

    // ==================== ADMINISTRATIV-BOSHQARUV VA XIZMAT ====================
    { term: "Davlat xizmati", definition: "Davlat organlarida haq evaziga amalga oshiriladigan professional faoliyat turi.", source: "Davlat fuqarolik xizmati to'g'risidagi qonun" },
    { term: "Lavozim yo'riqnomasi", definition: "Xodimning muayyan lavozim bo'yicha huquq, majburiyat va javobgarligini belgilovchi ichki hujjat.", source: "Mehnat huquqi" },
    { term: "Attestatsiya", definition: "Xodimning malakasi va lavozimga muvofiqligini davriy tekshirish jarayoni.", source: "Mehnat kodeksi" },
    { term: "Davlat xizmatchisining ishonch bildirishi", definition: "Davlat xizmatiga kirishda mansabdor shaxs zimmasiga yuklatiladigan ochiqlik va halollik majburiyati.", source: "Davlat fuqarolik xizmati to'g'risidagi qonun" },
    { term: "Elektron hukumat", definition: "Davlat xizmatlarini axborot-kommunikatsiya texnologiyalari orqali fuqarolarga taqdim etish tizimi.", source: "Elektron hukumat to'g'risidagi qonun" },
    { term: "Ochiq ma'lumotlar", definition: "Davlat organlari faoliyati to'g'risidagi, jamoatchilik foydalanishi uchun ochiq qo'yilgan ma'lumotlar.", source: "Axborot olish kafolatlari va erkinligi to'g'risidagi qonun" },
    { term: "Murojaatlarni ko'rib chiqish tartibi", definition: "Fuqaro va yuridik shaxslarning davlat organlariga qilgan murojaatlarini qonunda belgilangan muddatda ko'rib chiqish qoidalari.", source: "Jismoniy va yuridik shaxslarning murojaatlari to'g'risidagi qonun" },

    // ==================== JAMOAT XAVFSIZLIGI VA HUQUQ-TARTIBOT ====================
    { term: "Jamoat tartibi", definition: "Jamiyatda odob-axloq va xavfsizlik normalariga rioya etilishini ta'minlaydigan munosabatlar holati.", source: "Ma'muriy javobgarlik to'g'risidagi kodeks" },
    { term: "Favqulodda holat", definition: "Tabiiy yoki texnogen xarakterdagi hodisa natijasida yuzaga keladigan, aholi hayoti va sog'lig'iga xavf tug'diruvchi vaziyat.", source: "Favqulodda vaziyatlar to'g'risidagi qonun" },
    { term: "Fuqaro muhofazasi", definition: "Aholi va moddiy boyliklarni favqulodda vaziyatlar oqibatlaridan himoya qilish tadbirlari tizimi.", source: "Fuqaro muhofazasi to'g'risidagi qonun" },
    { term: "Yong'in xavfsizligi", definition: "Yong'inning oldini olish va uning oqibatlarini bartaraf etishga qaratilgan huquqiy va texnik talablar tizimi.", source: "Yong'in xavfsizligi to'g'risidagi qonun" },
    { term: "Yo'l harakati xavfsizligi", definition: "Transport vositalari harakati jarayonida hayot, sog'liq va mulkni muhofaza qilishga qaratilgan qoidalar majmui.", source: "Yo'l harakati xavfsizligi to'g'risidagi qonun" },
    { term: "Ichki ishlar organi", definition: "Jamoat tartibini, fuqarolarning xavfsizligini ta'minlash va jinoyatchilikka qarshi kurashish vazifasini bajaruvchi davlat organi.", source: "Ichki ishlar organlari to'g'risidagi qonun" },

    // ==================== SOG'LIQNI SAQLASH VA IJTIMOIY TA'MINOT HUQUQI ====================
    { term: "Tibbiy sug'urta", definition: "Fuqarolarning tibbiy xizmatdan foydalanish xarajatlarini qoplashga qaratilgan sug'urta turi.", source: "Majburiy tibbiy sug'urta to'g'risidagi qonun" },
    { term: "Nafaqa (pensiya)", definition: "Yoshi, mehnat qobiliyatini yo'qotishi yoki boquvchisini yo'qotishi munosabati bilan davlat tomonidan to'lanadigan doimiy pul ta'minoti.", source: "Fuqarolarning davlat pensiya ta'minoti to'g'risidagi qonun" },
    { term: "Ijtimoiy himoya", definition: "Aholining ijtimoiy ehtiyojmand toifalariga davlat tomonidan ko'rsatiladigan yordam va imtiyozlar tizimi.", source: "Ijtimoiy himoya to'g'risidagi qonunchilik" },
    { term: "Nogironlik", definition: "Sog'liqning barqaror buzilishi natijasida shaxsning hayotiy faoliyati cheklanishi va ijtimoiy himoyaga muhtojligi holati.", source: "Nogironligi bo'lgan shaxslarni ijtimoiy himoya qilish to'g'risidagi qonun" },
    { term: "Bemorning roziligi", definition: "Tibbiy aralashuvdan oldin bemordan olinishi shart bo'lgan, uning erkin va ongli qarori.", source: "Fuqarolarning sog'lig'ini saqlash to'g'risidagi qonun" },
    { term: "Tibbiy sir", definition: "Bemorning kasalligi va sog'lig'i to'g'risidagi ma'lumotlarning tibbiyot xodimlari tomonidan oshkor etilmasligi majburiyati.", source: "Fuqarolarning sog'lig'ini saqlash to'g'risidagi qonun" },

    // ==================== TA'LIM VA FAN HUQUQI ====================
    { term: "Majburiy umumiy o'rta ta'lim", definition: "Davlat tomonidan barcha fuqarolar uchun bepul va majburiy qilib belgilangan ta'lim bosqichi.", source: "Ta'lim to'g'risidagi qonun" },
    { term: "Davlat ta'lim standarti", definition: "Ta'lim mazmuni va sifatiga qo'yiladigan davlat tomonidan tasdiqlangan majburiy talablar tizimi.", source: "Ta'lim to'g'risidagi qonun" },
    { term: "Ta'lim to'g'risidagi hujjat (diplom)", definition: "Shaxsning muayyan ta'lim bosqichini muvaffaqiyatli tamomlaganligini tasdiqlovchi rasmiy davlat hujjati.", source: "Ta'lim to'g'risidagi qonun" },
    { term: "Ilmiy daraja", definition: "Shaxsning ilmiy-tadqiqot ishlarini muvaffaqiyatli yakunlaganligi uchun beriladigan malaka darajasi (PhD, DSc).", source: "Ilmiy va ilmiy-pedagogik kadrlarni attestatsiyadan o'tkazish to'g'risidagi nizom" },

    // ==================== AXBOROT VA RAQAMLI HUQUQ ====================
    { term: "Shaxsiy ma'lumotlar", definition: "Aniqlangan yoki aniqlanishi mumkin bo'lgan jismoniy shaxsga oid har qanday yozma yoki elektron ma'lumot.", source: "Shaxsga doir ma'lumotlar to'g'risidagi qonun" },
    { term: "Shaxsiy ma'lumotlarni qayta ishlash", definition: "Shaxsiy ma'lumotlarni yig'ish, saqlash, o'zgartirish yoki tarqatish bilan bog'liq har qanday harakat.", source: "Shaxsga doir ma'lumotlar to'g'risidagi qonun" },
    { term: "Kiberjinoyat", definition: "Axborot texnologiyalari yordamida yoki ularga qarshi sodir etiladigan jinoyat turi.", source: "Jinoyat kodeksi" },
    { term: "Axborot xavfsizligi", definition: "Axborot tizimlari va ma'lumotlarni ruxsatsiz kirish, buzish yoki yo'q qilishdan himoya qilish holati.", source: "Kiberxavfsizlik to'g'risidagi qonun" },
    { term: "Domen nomi", definition: "Internet tarmog'ida veb-resursni identifikatsiya qilish uchun ro'yxatdan o'tkazilgan noyob belgi.", source: "Axborotlashtirish to'g'risidagi qonun" },
    { term: "Ommaviy axborot vositasi", definition: "Ma'lumotlarni davriy ravishda cheksiz doiradagi shaxslarga yetkazib beruvchi vosita (gazeta, jurnal, telekanal va h.k.).", source: "Ommaviy axborot vositalari to'g'risidagi qonun" },
    { term: "Jurnalistning maxfiy manba huquqi", definition: "Jurnalistning o'ziga ma'lumot bergan shaxsning shaxsini oshkor etmaslik huquqi.", source: "Ommaviy axborot vositalari to'g'risidagi qonun" },

    // ==================== TADBIRKORLIK VA RAQOBAT HUQUQI ====================
    { term: "Raqobat", definition: "Xo'jalik yurituvchi subyektlarning bozorda mustaqil harakatlari orqali bir-birining imkoniyatlarini cheklovchi munosabatlar.", source: "Raqobat to'g'risidagi qonun" },
    { term: "Monopol faoliyat", definition: "Xo'jalik yurituvchi subyektning bozordagi ustun mavqeidan suiiste'mol qilib, raqobatni cheklovchi harakatlari.", source: "Raqobat to'g'risidagi qonun" },
    { term: "Ustun mavqe", definition: "Xo'jalik yurituvchi subyektning muayyan tovar bozorida raqobatga sezilarli ta'sir ko'rsatish imkoniyatiga ega bo'lgan holati.", source: "Raqobat to'g'risidagi qonun" },
    { term: "Insayder ma'lumot", definition: "Qimmatli qog'ozlar bozorida ochiq bo'lmagan, narxga sezilarli ta'sir ko'rsatishi mumkin bo'lgan maxfiy ma'lumot.", source: "Qimmatli qog'ozlar bozori to'g'risidagi qonun" },
    { term: "Adolatsiz raqobat", definition: "Boshqa xo'jalik yurituvchi subyektga zarar yetkazishga yoki uning obro'siga putur yetkazishga qaratilgan g'ayrihalol harakatlar.", source: "Raqobat to'g'risidagi qonun" },
    { term: "Investitsiya", definition: "Foyda olish yoki ijtimoiy foydali natijaga erishish maqsadida mulk va intellektual qadriyatlarni joylashtirish.", source: "Investitsiyalar va investitsiya faoliyati to'g'risidagi qonun" },
    { term: "Investorning huquqlari kafolati", definition: "Davlat tomonidan xorijiy va mahalliy investorlarning mulki hamda daromadlarini himoya qilish bo'yicha berilgan huquqiy kafolatlar.", source: "Investitsiyalar va investitsiya faoliyati to'g'risidagi qonun" },
    { term: "Davlat-xususiy sheriklik", definition: "Davlat va xususiy sektor o'rtasida ijtimoiy ahamiyatga molik loyihalarni birgalikda amalga oshirish shakli.", source: "Davlat-xususiy sheriklik to'g'risidagi qonun" },
    { term: "Sug'urta shartnomasi", definition: "Sug'urtalovchi sug'urta hodisasi yuzaga kelganda sug'urta qildiruvchiga tovon to'lash majburiyatini oladigan shartnoma.", source: "Sug'urta faoliyati to'g'risidagi qonun" },
    { term: "Sug'urta hodisasi", definition: "Sug'urta shartnomasida ko'zda tutilgan, yuz berganda sug'urta tovoni to'lanadigan voqea.", source: "Sug'urta faoliyati to'g'risidagi qonun" },
    { term: "Reket (bosim o'tkazish)", definition: "Tadbirkorlik sub'ektlariga nisbatan noqonuniy tazyiq yoki tahdid orqali mulkiy manfaat undirishga urinish.", source: "Jinoyat kodeksi" },

    // ==================== MIGRATSIYA VA FUQAROLIK HUQUQI ====================
    { term: "Fuqarolikka qabul qilish", definition: "Chet el fuqarosi yoki fuqaroligi bo'lmagan shaxsni O'zbekiston Respublikasi fuqaroligiga qonunda belgilangan tartibda qabul qilish.", source: "Fuqarolik to'g'risidagi qonun" },
    { term: "Fuqarolikni to'xtatish", definition: "Shaxsning O'zbekiston Respublikasi fuqaroligidan chiqishi yoki undan mahrum etilishi.", source: "Fuqarolik to'g'risidagi qonun" },
    { term: "Ikki fuqarolik", definition: "Shaxsning bir vaqtning o'zida ikki davlat fuqaroligiga ega bo'lish holati.", source: "Fuqarolik to'g'risidagi qonun" },
    { term: "Yashash uchun ruxsatnoma", definition: "Chet el fuqarosiga O'zbekiston hududida muayyan muddat yoki doimiy yashash huquqini beruvchi hujjat.", source: "Migratsiya to'g'risidagi qonun" },
    { term: "Mehnat migratsiyasi", definition: "Shaxsning ish topish maqsadida boshqa davlatga vaqtincha ko'chib borishi.", source: "Tashqi mehnat migratsiyasi to'g'risidagi qonun" },
    { term: "Ro'yxatga olish (propiska)", definition: "Fuqaroning yashash joyi bo'yicha davlat organlarida rasmiy hisobga qo'yilishi.", source: "Fuqarolarni ro'yxatga olish tartibi to'g'risidagi qonunchilik" },

    // ==================== MEROS HUQUQI ====================
    { term: "Vasiyat qilish erkinligi", definition: "Fuqaroning o'z mol-mulkini vasiyatnoma orqali istalgan shaxsga qoldirish huquqi.", source: "Fuqarolik kodeksi" },
    { term: "Majburiy ulush", definition: "Vasiyatnomadan qat'i nazar, muayyan qarindoshlarga (voyaga yetmagan farzandlar, nogiron ota-onalar) meros mulkidan kafolatlangan ulush.", source: "Fuqarolik kodeksi" },
    { term: "Qonun bo'yicha meros", definition: "Vasiyatnoma mavjud bo'lmagan taqdirda meros mulkining qonunda belgilangan navbat asosida merosxo'rlarga o'tishi.", source: "Fuqarolik kodeksi" },
    { term: "Merosdan voz kechish", definition: "Merosxo'rning o'ziga tegishli meros ulushidan rasmiy ravishda voz kechishi.", source: "Fuqarolik kodeksi" },
    { term: "Merosni qabul qilish", definition: "Merosxo'rning meros mulkini o'ziniki sifatida qabul qilish niyatini bildiruvchi harakati.", source: "Fuqarolik kodeksi" },
    { term: "Merosdan mahrum etish", definition: "Vasiyat qiluvchining o'z vasiyatnomasida muayyan qonuniy merosxo'rni meros huquqidan mahrum qilishi.", source: "Fuqarolik kodeksi" },
    { term: "Merosga noloyiq shaxslar", definition: "Vasiyat qiluvchiga yoki boshqa merosxo'rlarga nisbatan g'ayriqonuniy harakat qilgani sababli meros huquqidan mahrum etilgan shaxslar.", source: "Fuqarolik kodeksi" },

    // ==================== ARBITRAJ VA MURASSAFA HUQUQI ====================
    { term: "Hakamlik sudi (arbitraj)", definition: "Taraflarning kelishuviga ko'ra, nizoni davlat sudidan tashqarida hal qiluvchi nodavlat organ.", source: "Xalqaro tijorat arbitraji to'g'risidagi qonun" },
    { term: "Arbitraj kelishuvi", definition: "Taraflarning yuzaga kelgan yoki kelishi mumkin bo'lgan nizoni hakamlik sudida hal qilish to'g'risidagi kelishuvi.", source: "Xalqaro tijorat arbitraji to'g'risidagi qonun" },
    { term: "Kompetensiya-kompetensiya prinsipi", definition: "Hakamlik sudining o'z vakolati doirasi to'g'risidagi masalani mustaqil hal qilish huquqi.", source: "Xalqaro tijorat arbitraji to'g'risidagi qonun" },

    { term: "Madaniy meros ob'ekti", definition: "Tarixiy, ilmiy, badiiy yoki boshqa madaniy ahamiyatga ega bo'lib, davlat tomonidan muhofaza qilinadigan moddiy yoki nomoddiy meros.", source: "Madaniy meros ob'ektlarini muhofaza qilish va ulardan foydalanish to'g'risidagi qonun" },

    { term: "Rasmiy nashr", definition: "Normativ-huquqiy hujjatning kuchga kirishi uchun uni belgilangan manbada rasman e'lon qilish.", source: "Normativ-huquqiy hujjatlar to'g'risidagi qonun" },

    { term: "Korrupsiya", definition: "Mansabdor shaxsning shaxsiy manfaat uchun o'z xizmat mavqeidan g'ayriqonuniy foydalanishi.", source: "Korrupsiyaga qarshi kurashish to'g'risidagi qonun" },

    { term: "Whistleblower (signal beruvchi)", definition: "Korrupsiya yoki boshqa huquqbuzarlik haqida vakolatli organlarga xabar bergan va qonun bilan himoyalangan shaxs.", source: "Korrupsiyaga qarshi kurashish to'g'risidagi qonun" },
    { term: "Ombudsman apparati", definition: "Inson huquqlari bo'yicha vakilning faoliyatini ta'minlovchi ishchi organi.", source: "Oliy Majlisning Inson huquqlari bo'yicha vakili to'g'risidagi qonun" },

    { term: "Nogironligi bo'lgan shaxslar huquqi bo'yicha komissar", definition: "Nogironligi bo'lgan shaxslarning huquqlari buzilishining oldini olish va ularni himoya qilish bo'yicha vakolatli mansabdor shaxs.", source: "Nogironligi bo'lgan shaxslarni ijtimoiy himoya qilish to'g'risidagi qonun" },
    { term: "Jamoat nazorati", definition: "Fuqarolik jamiyati institutlari tomonidan davlat organlari faoliyati ustidan amalga oshiriladigan nazorat.", source: "Jamoatchilik nazorati to'g'risidagi qonun" },
    { term: "Nodavlat notijorat tashkiloti", definition: "Foyda olishni asosiy maqsad qilib qo'ymagan, ijtimoiy foydali faoliyat yurituvchi fuqarolik jamiyati instituti.", source: "Nodavlat notijorat tashkilotlari to'g'risidagi qonun" },
    { term: "Yig'ilish, miting va namoyish o'tkazish erkinligi", definition: "Fuqarolarning tinch va qurolsiz holda ommaviy tadbirlar o'tkazish konstitutsiyaviy huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Fikr va so'z erkinligi", definition: "Har bir shaxsning o'z fikrini erkin ifoda etish va uni tarqatish konstitutsiyaviy huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Shaxsiy daxlsizlik", definition: "Shaxsning qonunga muvofiq bo'lmagan holda hibsga olinishi, qidiruv qilinishi yoki cheklanishidan himoyalanish huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Uy-joy daxlsizligi", definition: "Shaxsning turar joyiga uning roziligisiz yoki qonuniy asossiz kirishning taqiqlanishi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Yozishmalar sirini saqlash huquqi", definition: "Shaxslarning pochta, telefon va boshqa aloqa vositalari orqali yozishmalari maxfiyligining konstitutsiyaviy kafolati.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Harakatlanish va yashash joyini tanlash erkinligi", definition: "Fuqaroning mamlakat hududi bo'ylab erkin harakatlanish va yashash joyini o'z xohishiga ko'ra tanlash huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Mulkdan foydalanish erkinligi", definition: "Mulk egasining o'z mulkidan qonun doirasida erkin foydalanish konstitutsiyaviy huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Sudga murojaat qilish huquqi", definition: "Har bir shaxsning o'z huquq va erkinliklarini himoya qilish uchun sudga murojaat qilish konstitutsiyaviy kafolati.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Malakali yuridik yordam olish huquqi", definition: "Shaxsning huquqiy yordamga, jumladan advokat xizmatidan foydalanishga bo'lgan konstitutsiyaviy huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "O'zini o'zi ayblashdan ozod etish huquqi", definition: "Shaxsning o'ziga, turmush o'rtog'iga yoki yaqin qarindoshlariga qarshi guvohlik berishga majburlanmaslik huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Bir jinoyat uchun ikki marta javobgarlikka tortmaslik prinsipi", definition: "Shaxsning bir xil jinoyat uchun qayta jinoiy javobgarlikka tortilishi mumkin emasligi tamoyili (non bis in idem).", source: "Jinoyat-protsessual kodeksi" },
    { term: "Qonun oldida tenglik", definition: "Barcha fuqarolarning irqi, millati, tili, dini, ijtimoiy kelib chiqishidan qat'i nazar qonun va sud oldida teng huquqli ekanligi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },

    { term: "Nasl-nasabni aniqlash (otalikni aniqlash)", definition: "Sud tartibida bolaning biologik ota-onasini huquqiy jihatdan tasdiqlash jarayoni.", source: "Oila kodeksi" },
    { term: "Ijaraga oluvchining tanlov huquqi (lizingda)", definition: "Lizing shartnomasi muddati tugagach, mulkni sotib olish, qaytarish yoki lizingni davom ettirish imkoniyati.", source: "Fuqarolik kodeksi" },
    { term: "Ustama qiymat", definition: "Bozor sharoitida tovar yoki xizmatning asl tannarxidan yuqori sotilishi natijasida hosil bo'ladigan farq.", source: "Iqtisodiy huquq" },
    { term: "Qonuniy vakil", definition: "Voyaga yetmagan yoki muomala layoqati cheklangan shaxs manfaatlarini qonun asosida ifodalovchi ota-ona, vasiy yoki homiy.", source: "Fuqarolik kodeksi" },
    { term: "Sudlanmaganlik to'g'risida ma'lumotnoma", definition: "Shaxsning sudlanganlik tarixi mavjud emasligini tasdiqlovchi rasmiy davlat hujjati.", source: "Ichki ishlar organlari tomonidan beriladigan ma'lumotnomalar tartibi" },
    { term: "Diplomatik pochta", definition: "Diplomatik vakolatxonaga tegishli, bojxona tekshiruvidan ozod qilingan maxfiy hujjatlar jo'natmasi.", source: "Xalqaro huquq" },
    { term: "Ekstraditsiya taqiqi", definition: "Shaxsni o'z fuqarosi bo'lgan davlat tomonidan boshqa davlatga topshirishning odatda taqiqlanishi.", source: "Jinoyat-protsessual kodeksi va xalqaro shartnomalar" }
];

            const gridEl = document.getElementById("legalDictionaryGrid");
            const searchInput = document.getElementById("legalSearchInput");
            const searchBtn = document.getElementById("legalSearchBtn");
            const alphabetFilter = document.getElementById("legalAlphabetFilter");

            let currentLetter = "ALL";
            let searchQuery = "";

            function renderDictionary() {
                gridEl.innerHTML = "";
                
                const filtered = dictionaryData.filter(item => {
                    const matchesSearch = item.term.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          item.definition.toLowerCase().includes(searchQuery.toLowerCase());
                    
                    let matchesLetter = true;
                    if (currentLetter !== "ALL") {
                        const firstChar = item.term.charAt(0).toUpperCase();
                        matchesLetter = firstChar === currentLetter;
                    }
                    
                    return matchesSearch && matchesLetter;
                });

                if (filtered.length === 0) {
                    gridEl.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #94a3b8; font-size: 1.1rem; animation: dictSlideDown 0.5s ease;">Qidiruv bo'yicha hech qanday atama topilmadi.</div>`;
                    return;
                }

                filtered.forEach((item, index) => {
                    const card = document.createElement("div");
                    card.className = "dict-card";
                    
                    const delay = Math.min(index * 0.04, 0.5);
                    card.style.animationDelay = `${delay}s`;

                    card.innerHTML = `
                        <div>
                            <div class="dict-term">${item.term}</div>
                            <div class="dict-definition">${item.definition}</div>
                        </div>
                        <div class="dict-source"><i class="fa-solid fa-book-bookmark"></i> ${item.source}</div>
                    `;
                    gridEl.appendChild(card);
                });
            }

            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value.trim();
                renderDictionary();
            });

            searchBtn.addEventListener("click", () => {
                searchQuery = searchInput.value.trim();
                renderDictionary();
            });

            alphabetFilter.addEventListener("click", (e) => {
                if (e.target.tagName === "BUTTON") {
                    Array.from(alphabetFilter.children).forEach(btn => btn.classList.remove("active"));
                    e.target.classList.add("active");
                    currentLetter = e.target.getAttribute("data-letter");
                    renderDictionary();
                }
            });

            renderDictionary();
        });
    </script>
