    <style>
        .legal-dictionary-section {

        .legal-dictionary-section .alphabet-filter button.active {

        .legal-dictionary-section .dictionary-grid {

        .legal-dictionary-section .dict-card {

        .legal-dictionary-section .dict-card::before {

        .legal-dictionary-section .dict-card:hover {

        .legal-dictionary-section .dict-card:hover::before {

        .legal-dictionary-section .dict-term {

        .legal-dictionary-section .dict-card:hover .dict-term {

        .legal-dictionary-section .dict-definition {

        .legal-dictionary-section .dict-source {

        .legal-dictionary-section .dict-card:hover .dict-source {
            background: rgba(6, 182, 212, 0.2);

        @keyframes dictSlideDown {
            0% {
                opacity: 0;
                transform: translateY(-25px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dictCardPop {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes dictPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }

<body>

    <section class="legal-dictionary-section">
        <div class="container">
            <h2 class="section-title">
                <i class="fa-solid fa-scale-balanced"></i> Yuridik Atamalar Lug'ati
            </h2>
            <p class="section-subtitle">
                O'zbekiston Respublikasining amaldagi qonunchiligi, kodekslari va huquqiy hujjatlarida qo'llaniladigan asosiy tushunchalarning kengaytirilgan izohli bazasi.
            </p>

            <!-- Boshqaruv va qidiruv paneli -->
            <div class="dictionary-controls">
                <div class="search-box">
                    <div class="search-icon-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <input type="text" id="legalSearchInput" placeholder="Atama yoki ta'rifni kiriting (masalan: Mulk huquqi)...">
                    <button class="search-action-btn" id="legalSearchBtn">
                        <span>Qidirish</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <!-- Alifbo bo'yicha filtrlar -->
                <div class="alphabet-filter" id="legalAlphabetFilter">
                    <button class="active" data-letter="ALL">Barchasi</button>
                    <button data-letter="A">A</button>
                    <button data-letter="B">B</button>
                    <button data-letter="D">D</button>
                    <button data-letter="E">E</button>
                    <button data-letter="F">F</button>
                    <button data-letter="G">G</button>
                    <button data-letter="H">H</button>
                    <button data-letter="I">I</button>
                    <button data-letter="J">J</button>
                    <button data-letter="K">K</button>
                    <button data-letter="L">L</button>
                    <button data-letter="M">M</button>
                    <button data-letter="N">N</button>
                    <button data-letter="O">O</button>
                    <button data-letter="P">P</button>
                    <button data-letter="Q">Q</button>
                    <button data-letter="R">R</button>
                    <button data-letter="S">S</button>
                    <button data-letter="T">T</button>
                    <button data-letter="U">U</button>
                    <button data-letter="V">V</button>
                    <button data-letter="X">X</button>
                    <button data-letter="Y">Y</button>

            </div>

            <!-- Kartochkalar chiqadigan panjara (Grid) -->
            <div class="dictionary-grid" id="legalDictionaryGrid"></div>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
const dictionaryData = [
    // A
    { term: "Yuridik shaxs", definition: "Mulk huquqiga ega bo'lgan, o'z nomidan majburiyatlar olib boruvchi tashkilot yoki korxona.", source: "Fuqarolik kodeksi" },
    { term: "Adliya", definition: "Huquq-tartibotni ta'minlash, sud ekspertizasini tashkil etish va qonun hujjatlarini tarqatish bilan shug'ullanuvchi davlat boshqaruvi organi.", source: "O'zbekiston Respublikasi Qonunchiligi" },
    { term: "Advokat", definition: "Jismoniy va yuridik shaxslarga yuridik yordam ko'rsatuvchi, sudlarda ularning manfaatlarini himoya qiluvchi mutaxassis.", source: "Advokatura to'g'risidagi qonun" },
    { term: "Afv etish", definition: "Jinoiy javobgarlikdan yoki jazodan ozod qilish yoxud tayinlangan jazoni yengillashtirish.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Aksiyadorlik jamiyati", definition: "Ustav kapitali aksiyalarga bo'lingan, qatnashchilari uning majburiyatlari bo'yicha javobgar bo'lmaydigan tijorat tashkiloti.", source: "Fuqarolik kodeksi" },
    { term: "Aliment", definition: "Voyaga yetmagan bolalarga yoki mehnatga layoqatsiz oila a'zolariga to'lanadigan majburiy pul mablag'lari.", source: "Oila kodeksi" },
    { term: "Amnistiya", definition: "Jinoyat sodir etgan shaxslarni jinoiy javobgarlikdan yoki jazodan to'la yoxud qisman ozod qilish akti.", source: "Jinoyat kodeksi" },
    { term: "Apellyatsiya", definition: "Sudning qonuniy kuchga kirmagan hal qiluv qarori ustidan yuqori turuvchi sudga shikoyat qilish huquqi.", source: "Protsessual kodekslar" },
    { term: "Arbitraj", definition: "Mulkiy va iqtisodiy nizolarni hal qilish uchun tuziladigan maxsus sud organi yoki hakamlar sudi.", source: "Iqtisodiy protsessual kodeksi" },
    { term: "Auksion", definition: "Mulk yoki mulkiy huquqlarni eng yuqori narx taklif qilgan shaxsga sotish ochiq savdo turi.", source: "Fuqarolik kodeksi" },
    { term: "Aybsizlik prezumpsiyasi", definition: "Shaxsning aybi qonuniy tartibda isbotlanmaguncha va sudning qonuniy hukmi chiqmaguncha u aybsiz hisoblanishi prinsipi.", source: "Konstitutsiya va JPK" },

    // B
    { term: "Birlik", definition: "Ma'muriy-hududiy bo'linishda yoki tashkiliy tuzilmada eng kichik huquqiy maqomga ega qism.", source: "Ma'muriy huquq" },
    { term: "Blokcheyn", definition: "Huquqiy tranzaksiyalar va ma'lumotlarni markazlashtirilmagan holda saqlash texnologiyasi.", source: "Raqamli qonunchilik" },
    { term: "Boj", definition: "Davlat organlari tomonidan maxsus xizmatlar ko'rsatilganligi uchun undiriladigan majburiy to'lov.", source: "Soliq kodeksi" },
    { term: "Bojxona hududi", definition: "Davlatning bojxona qonunchiligi to'liq amal qiladigan quruqlik, suv va havo kengliklari.", source: "Bojxona kodeksi" },
    { term: "Bojxona deklaratsiyasi", definition: "Chegaradan o'tayotgan tovarlar haqida bojxona organiga taqdim etiladigan rasmiy bayonot.", source: "Bojxona kodeksi" },
    { term: "Bojxona rejimi", definition: "Tovarlarning bojxona chegarasidan o'tkazilishi maqsadi va shartlarini belgilovchi qoidalar.", source: "Bojxona kodeksi" },
    { term: "Broker", definition: "Mijoz topshirig'iga ko'ra va uning hisobidan birja bitimlarini tuzuvchi professional vositachi.", source: "Fuqarolik kodeksi" },
    { term: "Bosh pudratchi", definition: "Buyurtmachi bilan shartnoma tuzib, ishlarni bajarish uchun boshqa subpudratchilarni jalb qiluvchi shaxs.", source: "Fuqarolik kodeksi" },
    { term: "Boshqaruv a'zosi", definition: "Yuridik shaxsning ijroiya organiga a'zo bo'lgan va boshqaruv funksiyalarini bajaruvchi shaxs.", source: "Fuqarolik kodeksi" },
    { term: "Boshpana huquqi", definition: "Davlatning o'z hududida chet el fuqarolariga ta'qibdan himoya qilish uchun beradigan huquqiy maqomi.", source: "Xalqaro huquq" },
    { term: "Buyruq", definition: "Rahbar tomonidan korxona yoki tashkilot ichida qabul qilinadigan majburiy ma'muriy hujjat.", source: "Mehnat kodeksi" },
    { term: "Buyurtmachi", definition: "Shartnoma asosida muayyan ishni bajarishni yoki xizmat ko'rsatishni topshiruvchi va haq to'lovchi taraf.", source: "Fuqarolik kodeksi" },
    { term: "Byurokratiya", definition: "Davlat boshqaruvida rasmiyatchilikka haddan tashqari berilish va ish yuritishning qiyinlashishi.", source: "Ma'muriy huquq" },
    { term: "Byudjet mablag'lari", definition: "Davlat yoki mahalliy byudjetdan muayyan maqsadlar uchun ajratiladigan pul mablag'lari.", source: "Byudjet kodeksi" },
    { term: "Byudjet tashkiloti", definition: "Davlat funksiyalarini bajarish uchun davlat byudjeti hisobidan to'liq moliyalashtiriladigan muassasa.", source: "Byudjet kodeksi" },
    { term: "Bankrotlik", definition: "Qarzdorning o'z kreditorlarining pul majburiyatlari bo'yicha talablarini qanoatlantirishga qodir emasligi.", source: "To'lovga qobiliyatsizlik to'g'risidagi qonun" },
    { term: "Bayonnoma", definition: "Tergov harakati, sud majlisi yoki yig'ilish jarayoni va natijalari qayd etiladigan rasmiy hujjat.", source: "Protsessual huquq" },
    { term: "Bojxona", definition: "Davlat chegarasidan tovarlar o'tkazilishini tartibga soluvchi va boj yig'imlarini undiruvchi organ.", source: "Bojxona kodeksi" },
    { term: "Byudjet", definition: "Davlatning daromadlari va xarajatlari ro'yxatini o'z ichiga olgan asosiy moliyaviy reja.", source: "Byudjet kodeksi" },

    // V
    { term: "Vakolat", definition: "Davlat organi yoki mansabdor shaxsga qonun bilan berilgan huquq va majburiyatlar doirasi.", source: "Huquq nazariyasi" },
    { term: "Vakolatnoma", definition: "Bir shaxs tomonidan ikkinchi shaxsga uchinchi shaxslar oldida vakillik qilish uchun berilgan yozma ruxsatnoma.", source: "Fuqarolik kodeksi" },
    { term: "Valyuta", definition: "Davlatning qonuniy to'lov vositasi hisoblangan pul belgilari yoki xalqaro hisob-kitob birliklari.", source: "Valyutani tartibga solish to'g'risidagi qonun" },
    { term: "Valyuta rezidenti", definition: "Mamlakat ichida doimiy yashaydigan va o'z valyuta operatsiyalarini shu davlat qonuni bo'yicha bajaruvchi shaxs.", source: "Valyuta qonunchiligi" },
    { term: "Vandalizm", definition: "Jamoat joylaridagi mol-mulkni, madaniy obyektlarni qasddan buzish yoki rasvo qilish jinoyati.", source: "Jinoyat kodeksi" },
    { term: "Vasiyatnoma", definition: "Fuqaroning vafot etgan taqdirda o'ziga tegishli mol-mulkni tasarruf etish bo'yicha qilgan yozma farmoyishi.", source: "Fuqarolik kodeksi" },
    { term: "Vasiyat majburiyati", definition: "Merosxo'r zimmasiga meros hisobidan uchinchi shaxs foydasiga biron-bir majburiyatni bajarishni yuklash.", source: "Fuqarolik kodeksi" },
    { term: "Vatandosh", definition: "Kelib chiqishi bir davlatga mansub bo'lgan, lekin xorijda yashayotgan yoki shu davlat fuqarosi bo'lgan shaxs.", source: "Xalqaro huquq" },
    { term: "Veksel", definition: "Qarz beruvchining qarz oluvchidan muayyan muddatda pulni qaytarishni talab qilish huquqini beruvchi qimmatli qog'oz.", source: "Fuqarolik kodeksi" },
    { term: "Verdikt", definition: "Sudda maslahatchilar (priyajnilar) hayati tomonidan ayblanuvchining aybdorligi yoki aybsizligi bo'yicha chiqarilgan qaror.", source: "Xalqaro protsessual huquq" },
    { term: "Veto huquqi", definition: "Vakolatli organning yoki mansabdor shaxsning qabul qilingan qonun yoki qarorni bir tomonlama taqiqlash huquqi.", source: "Konstitutsiyaviy huquq" },
    { term: "Viza", definition: "Xorijiy fuqaroning davlat hududiga kirishi yoki undan o'tishi uchun beriladigan rasmiy ruxsatnoma.", source: "Migratsiya huquqi" },
    { term: "Vindikatsiya", definition: "Mulkdorning o'z mulkini boshqa shaxsning qonunsiz egaligidan sud orqali qaytarib olish haqidagi da'vosi.", source: "Fuqarolik kodeksi" },
    { term: "Fors-major", definition: "Shartnoma majburiyatlarini bajarishga mutloq to'sqinlik qiluvchi muqarrar va bartaraf etib bo'lmaydigan kuch.", source: "Fuqarolik huquqi" },
    { term: "Voyaga yetganlik", definition: "Shaxsning qonun bilan to'liq huquq va majburiyatlarga ega bo'ladigan yoshga (18 yoshga) to'lishi.", source: "Fuqarolik kodeksi" },
    { term: "Voyaga yetmaganlar", definition: "Qonunchilikka ko'ra hali 18 yoshga to'lmagan va muomala layoqati cheklangan shaxslar.", source: "Fuqarolik kodeksi" },
    { term: "Vorislik", definition: "Vafot etgan shaxsning huquq va majburiyatlari qonun yoki vasiyat bo'yicha merosxo'rlarga o'tishi.", source: "Fuqarolik kodeksi" },
    { term: "Vasiylik", definition: "O'n to'rt yoshga to'lmagan yetim bolalarni yoki muomalaga layoqatsiz deb topilgan fuqarolarni himoya qilish shakli.", source: "Vasiylik va homiylik to'g'risidagi qonun" },
    { term: "Vositachilik", definition: "Bir shaxsning topshirig'iga ko'ra ikkinchi shaxsning manfaati yo'lida shartnoma tuzish bo'yicha xizmat ko'rsatishi.", source: "Fuqarolik kodeksi" },

    // D
    { term: "Davlat", definition: "Muayyan hududda siyosiy hokimiyatni amalga oshiruvchi, boshqaruv apparatiga ega bo'lgan suveren tashkilot.", source: "Konstitutsiyaviy huquq" },
    { term: "Da'vo muddati", definition: "Shaxs o'zining buzilgan huquqini da'vo qo'zg'ash yo'li bilan himoya qilishi mumkin bo'lgan muddat.", source: "Fuqarolik kodeksi" },
    { term: "Delegatsiya", definition: "Vakolatli shaxslar guruhi bo'lib, muayyan vazifalarni bajarish uchun boshqa joyga yoki tashkilotga yuboriladi.", source: "Xalqaro huquq" },
    { term: "Deputat", definition: "Vakillik organiga saylangan va fuqarolarning huquqlarini qonun chiqarish jarayonida himoya qiluvchi shaxs.", source: "Saylov qonunchiligi" },
    { term: "Direktiv", definition: "Yuqori turuvchi organ tomonidan quyi tashkilotlarga beriladigan majburiy ko'rsatma yoki yo'riqnoma.", source: "Boshqaruv huquqi" },
    { term: "Diskriminatsiya", definition: "Shaxslarni irqi, tili, dini yoki jinsiga qarab kamsitish va huquqlarini cheklashning taqiqlanishi.", source: "Inson huquqlari" },
    { term: "Divident", definition: "Aksiyadorlik jamiyati foydasidan uning aksiyadorlariga har yili to'lanadigan ulush.", source: "Tadbirkorlik huquqi" },
    { term: "Doktrina", definition: "Huquqiy nazariya, ta'limot yoki olimlarning huquqiy tizimni talqin qilishdagi ilmiy yondashuvlari.", source: "Huquq nazariyasi" },
    { term: "Donatsiya", definition: "Ehson qilish, ya'ni mol-mulkni foydali maqsadlarda tekinga boshqa shaxsga topshirish.", source: "Fuqarolik kodeksi" },
    { term: "Dalil", definition: "Ish bo'yicha haqiqatni aniqlash uchun qonuniy tartibda olingan har qanday faktik ma'lumotlar.", source: "Protsessual kodekslar" },
    { term: "Dalillarni maqbulligi", definition: "Dalillarning qonunda belgilangan tartibda va ruxsat berilgan manbalardan olinganlik xususiyati.", source: "Protsessual kodekslar" },
    { term: "Davlatchilik", definition: "Jamiyatni siyosiy, iqtisodiy va huquqiy tashkil etish tizimi hamda davlat organlari majmui.", source: "Huquq nazariyasi" },
    { term: "Davlat tili", definition: "Konstitutsiya bilan davlat hududida rasmiy ish yuritish va muloqot uchun belgilangan majburiy til.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Davlat xaridlari", definition: "Davlat ehtiyojlari uchun tovarlar va xizmatlarni shartnoma hamda tender asosida sotib olish tizimi.", source: "Davlat xaridlari to'g'risidagi qonun" },
    { term: "Davlat xizmatchisi", definition: "Davlat organlarida haq evaziga professional faoliyatni amalga oshiruvchi va vakolatlarga ega shaxs.", source: "Davlat fuqarolik xizmati to'g'risidagi qonun" },
    { term: "Davlat siri", definition: "Davlat tomonidan qo'riqlanadigan va oshkor etilishi uning xavfsizligiga zarar yetkazadigan maxfiy ma'lumotlar.", source: "Davlat sirlarini saqlash to'g'risidagi qonun" },
    { term: "Da'vo", definition: "Buzilgan huquqni himoya qilishni so'rab sudga taqdim etiladigan rasmiy arizaviy talab.", source: "Protsessual kodekslar" },
    { term: "Da'vogar", definition: "O'zining buzilgan huquqini tiklashni talab qilib sudga da'vo arizasi bilan murojaat qilgan taraf.", source: "Protsessual kodekslar" },
    { term: "De-fakto", definition: "Xalqaro va milliy huquqda munosabatlarning rasman tan olinmagan, lekin amalda mavjud bo'lgan holati.", source: "Xalqaro huquq" },
    { term: "De-yure", definition: "Munosabatlarning qonuniy asosda, rasmiy ravishda va to'liq tan olingan huquqiy holati.", source: "Xalqaro huquq" },
    { term: "Debitor", definition: "Shartnoma yoki qonun asosida boshqa shaxs (kreditor) oldida pul yoki mulkiy majburiyati bor qarzdor.", source: "Fuqarolik kodeksi" },
    { term: "Debitorlik qarzi", definition: "Boshqa shaxslar yoki tashkilotlar tomonidan korxonaga to'lanishi lozim bo'lgan pul mablag'lari qiymati.", source: "Fuqarolik kodeksi" },
    { term: "Devalvatsiya", definition: "Milliy valyuta qadrining xorijiy valyutalarga nisbatan rasman pasayishi yoki pasaytirilishi.", source: "Moliya huquqi" },
    { term: "Deklaratsiya", definition: "Davlat yoki shaxs tomonidan prinsiplar, daromadlar yoki tovarlar haqida beriladigan rasmiy bayonot.", source: "Soliq va Bojxona kodekslari" },
    { term: "Dekret", definition: "Oliy davlat organi yoki prezident tomonidan qabul qilinadigan, qonun kuchiga ega bo'lgan farmon.", source: "Huquq tarixi va nazariyasi" },
    { term: "Delikt", definition: "Shartnomadan tashqari holda boshqa shaxsga, uning mulki yoki sog'lig'iga zarar yetkazish bilan bog'liq huquqbuzarlik.", source: "Fuqarolik kodeksi" },
    { term: "Delimitation", definition: "Xalqaro huquqda qo'shni davlatlar o'rtasidagi chegaralarni muzokaralar orqali xaritada belgilash.", source: "Xalqaro huquq" },
    { term: "Demarkatsiya", definition: "Xalqaro huquqda xaritadagi chegaralarni joyning o'zida maxsus belgi va ustunlar bilan o'rnatish.", source: "Xalqaro huquq" },
    { term: "Demilitarizatsiya", definition: "Xalqaro shartnomaga ko'ra muayyan hududda harbiy inshootlarni yo'q qilish va qo'shin saqlashni taqiqlash.", source: "Xalqaro huquq" },
    { term: "Demisiy", definition: "Oliy mansabdor shaxsning (masalan, vazir yoki hukumatning) o'z xohishi bilan iste'foga chiqishi.", source: "Konstitutsiyaviy huquq" },
    { term: "Demokratiya", definition: "Davlat boshqaruvida xalq hokimiyatchiligi va fuqarolar tengligini ta'minlovchi siyosiy-huquqiy rejim.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Denonsatsiya", definition: "Davlatning o'zi tuzgan xalqaro shartnomani qonuniy tartibda bekor qilishi va undan chiqishi.", source: "Xalqaro huquq" },
    { term: "Denominatsiya", definition: "Pul muomalasini tartibga solish uchun eski pul belgilarini ma'lum nisbatda yangisiga almashtirish.", source: "Moliya huquqi" },
    { term: "Depozit", definition: "Bankka yoki maxsus muassasaga saqlash va foiz olish maqsadida qo'yilgan pul yoki qimmatbaho buyumlar.", source: "Fuqarolik kodeksi" },
    { term: "Depozitariy", definition: "Qimmatli qog'ozlarga bo'lgan huquqlarni hisobga oluvchi va ularni saqlovchi ixtisoslashgan tashkilot.", source: "Qimmatli qog'ozlar bozori to'g'risidagi qonun" },
    { term: "Deprivatsiya", definition: "Qonun bilan berilgan huquqlar yoki imtiyozlardan shaxsni majburiy tarzda mahrum qilish.", source: "Huquq nazariyasi" },
    { term: "Derogatsiya", definition: "Favqulodda holatlarda davlat tomonidan ayrim inson huquqlari amal qilishini vaqtincha cheklash.", source: "Xalqaro huquq" },
    { term: "Desentralizatsiya", definition: "Vakolatlarni markaziy davlat organlaridan mahalliy organlarga yoki o'z-o'zini boshqarish organlariga o'tkazish.", source: "Ma'muriy huquq" },
    { term: "Detant", definition: "Xalqaro munosabatlarda davlatlar o'rtasidagi keskinlikning yumshashi va kelishuvlar davri.", source: "Xalqaro huquq" },
    { term: "Detensiya", definition: "Shaxsni tergov yoki sud qarorigacha qonuniy asosda vaqtincha ushlab turish (hibsga olish).", source: "Jinoyat-protsessual kodeksi" },
    { term: "Dizertirlik", definition: "Harbiy xizmatchining xizmat joyini qasddan va butunlay tark etishi bilan bog'liq harbiy jinoyat.", source: "Jinoyat kodeksi" },
    { term: "Diplomatik immunitet", definition: "Diplomatlarning mezbon davlatda jinoiy, ma'muriy va fuqarolik javobgarligidan ozod etilishi.", source: "Xalqaro huquq" },
    { term: "Diplomatik korpus", definition: "Muayyan davlatda akkreditatsiya qilingan barcha xorijiy diplomatik vakolatxonalar rahbarlari majmui.", source: "Xalqaro huquq" },
    { term: "Dispozitsiya", definition: "Huquqiy norma tarkibiy qismi bo'lib, shaxslar bajarishi lozim bo'lgan xulq-atvor qoidasini belgilaydi.", source: "Huquq nazariyasi" },
    { term: "Dispozitivlik", definition: "Fuqarolik protsessida taraflarning o'z huquqlarini shaxsiy xohishiga ko'ra erkin tasarruf etish prinsipi.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Diskvalifikatsiya", definition: "Mansabdor shaxsni muayyan muddatga rahbarlik lavozimlarini egallash huquqidan mahrum qilish jazosi.", source: "Ma'muriy javobgarlik to'g'risidagi kodeks" },
    { term: "Domen", definition: "Internet tarmog'ida yuridik yoki jismoniy shaxsning sayti ro'yxatdan o'tgan rasmiy elektron manzil.", source: "Axborotlashtirish to'g'risidagi qonun" },
    { term: "Doping", definition: "Sport huquqida sportchilar tomonidan jismoniy tayyorgarlikni sun'iy oshirish uchun taqiqlangan moddalarni qo'llash.", source: "Jismoniy tarbiya va sport to'g'risidagi qonun" },
    { term: "Dublikat", definition: "Yo'qolgan yoki shikastlangan asl hujjat o'rniga beriladigan, u bilan bir xil yuridik kuchga ega nusxa.", source: "Fuqarolik kodeksi" },

    // E
    { term: "Emansipatsiya", definition: "O'n olti yoshga to'lgan voyaga yetmagan shaxs o'zining mehnat shartnomasi yoki tadbirkorlik faoliyati bilan shug'ullanishi natijasida to'la muomalaga layoqatli deb e'lon qilinishi.", source: "Fuqarolik kodeksi" },
    { term: "Ekspertiza", definition: "Maxsus bilim va fan sohalarida tekshiruv o'tkazib, xulosa berish jarayoni.", source: "Protsessual kodekslar" },
    { term: "Ekstraditsiya", definition: "Jinoyat sodir etgan shaxsni jinoiy javobgarlikka tortish uchun boshqa davlatga topshirish.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Emigratsiya", definition: "Fuqarolarning o'z mamlakatini tark etib, boshqa davlatga doimiy yashash uchun ko'chib ketishi.", source: "Migratsiya qonunchiligi" },
    { term: "Egalik huquqi", definition: "Mulk huquqining tarkibiy qismi bo'lib, ashyoni o'z xohishiga ko'ra jismoniy saqlash va nazorat qilish imkoniyati.", source: "Fuqarolik kodeksi" },
    { term: "Egalik huquqini vujudga keltiruvchi muddat", definition: "Mulkdor bo'lmagan shaxsning o'zga mulkka uzoq vaqt (15 yil) halol egalik qilishi orqali unga mulk huquqini olishi.", source: "Fuqarolik kodeksi" },
    { term: "Ekvivalentlik", definition: "Fuqarolik-huquqiy munosabatlarda berilgan tovar yoki xizmat qiymatining unga to'langan haqqa mos kelishi.", source: "Fuqarolik kodeksi" },
    { term: "Ekologik ekspertiza", definition: "Xo'jalik faoliyatining atrof-muhitga ta'sirini aniqlash maqsadida o'tkaziladigan majburiy tekshiruv.", source: "Ekologik ekspertiza to'g'risidagi qonun" },
    { term: "Ekologik zarar", definition: "Atrof-muhitning ifloslanishi natijasida tabiatga va inson salomatligiga yetkazilgan moddiy ziyon.", source: "Tabiatni muhofaza qilish to'g'risidagi qonun" },
    { term: "Ekspropriatsiya", definition: "Davlat yoki jamoat ehtiyojlari uchun xususiy mulkni haqini to'lagan holda majburiy ravishda olib qo'yish.", source: "Fuqarolik kodeksi" },
    { term: "Ekstremizm", definition: "Jamiyatda qabul qilingan qonunlar va tartibga qarshi o'ta keskin qarashlar va mafkuralarni tarqatish.", source: "Ekstremizmga qarshi kurashish to'g'risidagi qonun" },
    { term: "Elektron raqamli imzo", definition: "Elektron hujjatdagi ma'lumotlarni haqiqiyligini va muallifini tasdiqlovchi rekvizit (imzo).", source: "Elektron hujjat aylanishi to'g'risidagi qonun" },
    { term: "Elektron tijorat", definition: "Axborot tizimlari va internet orqali amalga oshiriladigan tovarlar oldi-sotdisi va xizmatlar.", source: "Elektron tijorat to'g'risidagi qonun" },
    { term: "Embargo", definition: "Davlat tomonidan boshqa mamlakatga tovarlar yoki qurol-yarog' olib kirish/olib chiqishga qo'yilgan rasmiy taqiq.", source: "Xalqaro huquq" },
    { term: "Emissiya", definition: "Muomalaga yangi pul belgilari yoki qimmatli qog'ozlarni (aksiyalar, obligatsiyalar) chiqarish faoliyati.", source: "Moliya huquqi" },
    { term: "Emitent", definition: "Qonuniy asosda qimmatli qog'ozlar yoki pullarni muomalaga chiqaruvchi yuridik shaxs yoki davlat organi.", source: "Qimmatli qog'ozlar bozori to'g'risidagi qonun" },
    { term: "Epizootiya", definition: "Hayvonlar o'rtasida yuqumli kasalliklarning keng tarqalishi tufayli kiritiladigan huquqiy rejim.", source: "Veterinariya to'g'risidagi qonun" },
    { term: "Erkin iqtisodiy zona", definition: "Tadbirkorlar uchun soliq va bojxona imtiyozlari berilgan alohida ajratilgan hudud.", source: "Erkin iqtisodiy zonalar to'g'risidagi qonun" },
    { term: "Erkinliklar", definition: "Insonning davlat va jamiyat aralashuvisiz o'z xohishiga ko'ra harakat qilish konstitutsiyaviy imkoniyatlari.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Eshittirish huquqi", definition: "Radio va televideniye tashkilotlarining o'z ko'rsatuvlarini tarqatishga bo'lgan intellektual mulk huquqi.", source: "Mualliflik huquqi" },
    { term: "E'tirof etish", definition: "Sud yoki vakolatli organ tomonidan muayyan fakt, huquq yoki xalqaro maqomning haqiqiy deb tan olinishi.", source: "Huquq nazariyasi" },

    // F
    { term: "Fuqarolik", definition: "Shaxsning muayyan davlat bilan siyosiy-huquqiy aloqasi, ularning o'zaro huquq va burchlari majmui.", source: "O'zbekiston Respublikasi qonunchiligi" },

    // G
    { term: "Guvoh", definition: "Jinoyat ishi bo'yicha ahamiyatga molik holatlarni bilishi mumkin bo'lgan jismoniy shaxs.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Garant", definition: "Birovning majburiyatini bajarish uchun kafillik beruvchi shaxs yoki tashkilot.", source: "Fuqarolik kodeksi" },
    { term: "Genotsid", definition: "Milliy, etnik, irqiy yoki diniy guruhlarni to'la yoki qisman yo'q qilishga qaratilgan og'ir jinoyat.", source: "Jinoyat kodeksi" },

    // H
    { term: "Hokimiyat", definition: "Davlat organlari va mansabdor shaxslarning jamiyat hayotini boshqarishdagi vakolatlari va huquqiy kuchi.", source: "Konstitutsiyaviy huquq" },
    { term: "Hukm", definition: "Sud tomonidan jinoyat ishi bo'yicha aybdorlik yoki aybsizlikni e'lon qilib chiqariladigan asosiy qaror.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Homiylik", definition: "Jismoniy yoki yuridik shaxslarning xayriya maqsadlarida bepul yordam ko'rsatishi.", source: "Vasiylik va homiylik to'g'risidagi qonun" },

    // I
    { term: "Iltimosnoma", definition: "Protsessual harakatni bajarish yoki qaror qabul qilishni so'rab vakolatli organga murojaat qilish.", source: "Protsessual kodekslar" },
    { term: "Imtiyoz", definition: "Ayrim shaxslarga yoki toifalarga qonun bilan beriladigan maxsus afzalliklar yoki huquqlar.", source: "Qonunchilik" },
    { term: "Intellektual mulk", definition: "Aqliy faoliyat natijalari va unga bo'lgan mutlaq huquqlar majmui.", source: "Fuqarolik kodeksi" },
    { term: "Inson huquqlari", definition: "Har bir insonga tug'ilishidan boshlab tegishli bo'lgan ajralmas huquq va erkinliklar.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Ipoteka", definition: "Ko'chmas mulk garoviga asoslangan holda bank yoki kredit tashkilotidan beriladigan qarz.", source: "Ipoteka to'g'risidagi qonun" },

    // J
    { term: "Jarima", definition: "Huquqbuzar zimmasiga sud yoki vakolatli organ tomonidan yuklatiladigan majburiy pul to'lovi jazosi.", source: "Jinoyat va Ma'muriy kodekslar" },
    { term: "Jinoyat", definition: "Qonun bilan taqiqlangan va ijtimoiy xavfli bo'lgan qilmish (harakat yoki harakatsizlik).", source: "Jinoyat kodeksi" },
    { term: "Jismoniy shaxs", definition: "Huquqiy munosabatlarning yakka tartibdagi subyekti bo'lgan O'zbekiston fuqarosi, chet el fuqarosi yoki fuqaroligi bo'lmagan shaxs.", source: "Fuqarolik kodeksi" },

    // K
    { term: "Kafillik", definition: "Bir shaxsning boshqa shaxs kreditorlari oldida o'z majburiyatini to'liq yoki qisman bajarishi uchun javobgar bo'lishi.", source: "Fuqarolik kodeksi" },
    { term: "Konstitutsiya", definition: "Davlatning asosiy qonuni bo'lib, uning tuzilishi, fuqarolarning asosiy huquq va burchlarini belgilaydi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Kreditor", definition: "Qarzdordan pul yoki mulk talab qilish huquqiga ega bo'lgan taraf.", source: "Fuqarolik kodeksi" },

    // L
    { term: "Litsenziya", definition: "Alohida turdagi faoliyatni amalga oshirish uchun vakolatli organ tomonidan beriladigan maxsus ruxsatnoma.", source: "Litsenziyalash to'g'risidagi qonun" },
    { term: "Lizing", definition: "Mulkni ijaraga berish va kelgusida uni sotib olish huquqini beruvchi moliyaviy shartnoma turi.", source: "Fuqarolik kodeksi" },

    // M
    { term: "Meros", definition: "Vafot etgan shaxsga tegishli bo'lgan mol-mulk va huquq-burchlarning merosxo'rlarga o'tishi.", source: "Fuqarolik kodeksi" },
    { term: "Monitoring", definition: "Huquqiy jarayonlar, soliqlar yoki shartnomalar bajarilishining doimiy kuzatuvi va tahlili.", source: "Qonunchilik" },
    { term: "Mulk huquqi", definition: "Shaxsning o'ziga qarashli mol-mulkka o'z xohishi bilan egalik qilish, undan foydalanish va uni tasarruf etish huquqi.", source: "Fuqarolik kodeksi" },

    // N
    { term: "Notarius", definition: "Fuqarolar va yuridik shaxslarning huquqlarini tasdiqlovchi, bitimlar tuzishda yordam beruvchi huquqshunos.", source: "Notariat to'g'risidagi qonun" },
    { term: "Normativ-huquqiy hujjat", definition: "Qonuniy qoidalarni belgilash, o'zgartirish yoki bekor qilishga qaratilgan rasmiy hujjat.", source: "Normativ-huquqiy hujjatlar to'g'risidagi qonun" },

    // O
    { term: "Ombudsman", definition: "Inson huquqlari bo'yicha vakil bo'lib, fuqarolarning huquqlari buzilishini nazorat qiluvchi parlament instituti.", source: "Oliy Majlisning Inson huquqlari bo'yicha vakili (Ombudsman) to'g'risidagi qonun" },

    // P
    { term: "Pudrat", definition: "Bir taraf ikkinchi taraf topshirig'i bo'yicha muayyan ishni bajarish va uning natijasini topshirish majburiyatini oluvchi shartnoma.", source: "Fuqarolik kodeksi" },

    // Q
    { term: "Qonun", definition: "Oliy vakillik organi tomonidan qabul qilinadigan, eng yuqori yuridik kuchga ega bo'lgan normativ hujjat.", source: "Konstitutsiyaviy tuzum" },
    { term: "Qarzdor", definition: "Kreditor oldida muayyan majburiyatlarni bajarishi shart bo'lgan shaxs.", source: "Fuqarolik kodeksi" },

    // R
    { term: "Reabilitatsiya", definition: "Noqonuniy ravishda jinoiy javobgarlikka tortilgan yoki huquqlari buzilgan shaxsning oqlanishi va huquqlari tiklanishi.", source: "Protsessual kodekslar" },

    // S
    { term: "Servitut", definition: "O'zga yer uchastkasidan cheklangan tarzda foydalanish huquqi.", source: "Yer kodeksi va Fuqarolik kodeksi" },
    { term: "Soliq", definition: "Davlat byudjetiga jismoniy va yuridik shaxslar tomonidan to'lanadigan majburiy to'lov.", source: "Soliq kodeksi" },
    { term: "Sud", definition: "Adolatni amalga oshiruvchi, nizolarni ko'rib chiquvchi va qonunbuzarlarga nisbatan jazo belgilovchi organ.", source: "Sudlar to'g'risidagi qonun" },

    // T
    { term: "Tadbirkorlik", definition: "Foyda topish maqsadida tavakkal qilib amalga oshiriladigan tashabbuskorlik faoliyati.", source: "Fuqarolik kodeksi" },
    { term: "Talabnoma", definition: "Huquqi buzilgan shaxsning qoidabuzarga ixtiyoriy ravishda majburiyatni bajarish haqidagi yozma murojaati.", source: "Fuqarolik kodeksi" },

    // U
    { term: "Ustav kapitali", definition: "Yuridik shaxs tashkil etilganda muassislar tomonidan qo'shiladigan dastlabki mablag'lar yig'indisi.", source: "Fuqarolik kodeksi" },

    // X
    { term: "Xususiy mulk", definition: "Fuqarolar yoki yuridik shaxslarga tegishli bo'lgan va qonun bilan qo'riqlanadigan mulk shakli.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },

    // Z
    { term: "Zarar", definition: "Buzilgan huquqni tiklash uchun qilingan xarajatlar, mulkning yo'qolishi yoki shikastlanishi hamda olinmagan daromadlar.", source: "Fuqarolik kodeksi" },

    // ==================== FUQAROLIK HUQUQI: SHARTNOMALAR VA MAJBURIYATLAR ====================
    { term: "Shartnoma", definition: "Ikki yoki undan ortiq shaxs o'rtasida fuqarolik huquq va majburiyatlarini o'rnatish, o'zgartirish yoki bekor qilish to'g'risidagi kelishuv.", source: "Fuqarolik kodeksi" },
    { term: "Majburiyat", definition: "Qarzdorning kreditor foydasiga muayyan harakatni bajarishi yoki bajarishdan tiyilishi lozim bo'lgan huquqiy munosabat.", source: "Fuqarolik kodeksi" },
    { term: "Oferta", definition: "Shartnoma tuzish taklifi bo'lib, uni qabul qilgan taraf uchun huquqiy oqibat keltirib chiqaradigan aniq bildirishnoma.", source: "Fuqarolik kodeksi" },
    { term: "Aksept", definition: "Oferta (taklif)ni to'liq va so'zsiz qabul qilish to'g'risidagi bildirishnoma.", source: "Fuqarolik kodeksi" },
    { term: "Qarz shartnomasi", definition: "Bir taraf ikkinchi tarafga pul yoki boshqa ashyolarni mulk qilib berib, ikkinchi taraf esa xuddi shunday miqdorni qaytarish majburiyatini oladigan shartnoma.", source: "Fuqarolik kodeksi" },
    { term: "Ijara shartnomasi", definition: "Ijaraga beruvchi ijarachiga mulkni haq evaziga vaqtincha egalik qilish va foydalanish uchun topshiradigan shartnoma.", source: "Fuqarolik kodeksi" },
    { term: "Hadya shartnomasi", definition: "Bir taraf ikkinchi tarafga mol-mulk yoki mulkiy huquqni tekinga topshiradigan shartnoma.", source: "Fuqarolik kodeksi" },
    { term: "Saqlash shartnomasi", definition: "Bir taraf ikkinchi tarafdan olingan ashyoni saqlab, uni saqlangan holicha qaytarish majburiyatini oladigan shartnoma.", source: "Fuqarolik kodeksi" },
    { term: "Komissiya shartnomasi", definition: "Vositachi (komissioner) o'z nomidan, lekin topshiruvchi hisobidan bitimlar tuzish majburiyatini oladigan shartnoma.", source: "Fuqarolik kodeksi" },
    { term: "Topshiriq shartnomasi", definition: "Vakilning ishonch bildiruvchi nomidan va uning hisobidan muayyan yuridik harakatlarni bajarish majburiyati.", source: "Fuqarolik kodeksi" },
    { term: "Ashyoviy huquq", definition: "Shaxsning ashyoga bevosita hukmronlik qilish va uni har qanday uchinchi shaxsdan himoya qilish huquqi.", source: "Fuqarolik kodeksi" },
    { term: "Majburiyat huquqi", definition: "Shaxslar o'rtasidagi mulkiy munosabatlarni tartibga soluvchi fuqarolik huquqi bo'limi.", source: "Fuqarolik kodeksi" },
    { term: "Sud xarajatlari", definition: "Ish yuritish jarayonida davlat boji va boshqa protsessual harakatlar bilan bog'liq taraflar qilgan xarajatlar.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Davlat boji", definition: "Sudga murojaat qilish yoki boshqa yuridik ahamiyatga molik harakatlar uchun davlat foydasiga to'lanadigan majburiy to'lov.", source: "Soliq kodeksi" },
    { term: "Bitim", definition: "Fuqarolik huquq va majburiyatlarini o'rnatish, o'zgartirish yoki bekor qilishga qaratilgan fuqaro va yuridik shaxslarning harakatlari.", source: "Fuqarolik kodeksi" },
    { term: "Nomukammal bitim (haqiqiy bo'lmagan bitim)", definition: "Qonun talablariga zid tuzilganligi sababli huquqiy oqibat keltirib chiqarmaydigan bitim.", source: "Fuqarolik kodeksi" },
    { term: "Muddat", definition: "Fuqarolik huquq va majburiyatlarining yuzaga kelishi, o'zgarishi yoki tugashi bog'liq bo'lgan vaqt kesimi.", source: "Fuqarolik kodeksi" },
    { term: "Da'vo muddatining to'xtatilishi", definition: "Muayyan holatlar mavjud bo'lganda da'vo muddati hisobi vaqtincha to'xtab turishi.", source: "Fuqarolik kodeksi" },
    { term: "Regress da'vosi", definition: "Boshqa shaxs uchun javobgarlikni o'z zimmasiga olgan shaxsning aybdor shaxsdan to'langan summani qaytarib olish uchun beradigan da'vosi.", source: "Fuqarolik kodeksi" },
    { term: "Solidar javobgarlik", definition: "Bir necha qarzdorning kreditor oldida birgalikda va har biri to'liq hajmda javobgar bo'lishi.", source: "Fuqarolik kodeksi" },
    { term: "Subsidiar javobgarlik", definition: "Asosiy qarzdor majburiyatni bajarmagan taqdirdagina qo'shimcha javobgar shaxsning javobgarlikka tortilishi.", source: "Fuqarolik kodeksi" },
    { term: "Ustama pul (penya)", definition: "Majburiyat muddatida bajarilmagani uchun qarzdor zimmasiga yuklatiladigan qo'shimcha pul to'lovi.", source: "Fuqarolik kodeksi" },
    { term: "Jarima nesutoyka", definition: "Majburiyat bajarilmagani yoki lozim darajada bajarilmagani uchun qarzdor kreditorga to'lashi shart bo'lgan pul summasi.", source: "Fuqarolik kodeksi" },
    { term: "Aloqador shaxslar", definition: "O'zaro iqtisodiy yoki huquqiy bog'liqlik tufayli bir-birining qarorlariga ta'sir ko'rsatish imkoniyatiga ega shaxslar.", source: "Fuqarolik kodeksi" },

    // ==================== MULK VA MOLIYAVIY MUNOSABATLAR ====================
    { term: "Umumiy mulk", definition: "Ikki yoki undan ortiq shaxsga tegishli bo'lgan, ulush aniqlangan yoki aniqlanmagan mulk.", source: "Fuqarolik kodeksi" },
    { term: "Servitut huquqi", definition: "O'zga yer uchastkasi yoki boshqa ko'chmas mulkdan cheklangan tarzda foydalanish huquqi.", source: "Fuqarolik kodeksi va Yer kodeksi" },
    { term: "Xo'jalik yuritish huquqi", definition: "Davlat unitar korxonasining unga biriktirilgan mulkka egalik qilish, foydalanish va tasarruf etish huquqi.", source: "Fuqarolik kodeksi" },
    { term: "Operativ boshqaruv huquqi", definition: "Muassasa yoki qozna korxonasining o'ziga biriktirilgan mulkdan qonun doirasida foydalanish huquqi.", source: "Fuqarolik kodeksi" },
    { term: "Ko'chmas mulk", definition: "Yer uchastkalari, bino, inshoot va joyidan ko'chirib bo'lmaydigan boshqa mulk.", source: "Fuqarolik kodeksi" },
    { term: "Ko'char mulk", definition: "Ko'chmas mulk toifasiga kirmaydigan, jismoniy jihatdan bir joydan ikkinchi joyga ko'chirilishi mumkin bo'lgan mulk.", source: "Fuqarolik kodeksi" },
    { term: "Davlat ro'yxatidan o'tkazish", definition: "Ko'chmas mulkka bo'lgan huquqlarni yagona davlat reyestrida qayd etish tartibi.", source: "Ko'chmas mulk davlat kadastri to'g'risidagi qonun" },
    { term: "Notarial tasdiqlash", definition: "Notarius tomonidan bitim yoki hujjatning qonuniyligini va haqiqiyligini rasmiy tasdiqlash harakati.", source: "Notariat to'g'risidagi qonun" },
    { term: "Bank kafolati", definition: "Bank yoki boshqa kredit tashkilotining boshqa shaxs majburiyatini bajarish uchun yozma kafolat berishi.", source: "Fuqarolik kodeksi" },
    { term: "Akkreditiv", definition: "Bank tomonidan mijoz topshirig'iga ko'ra uchinchi shaxs foydasiga hujjatlar taqdim etilishi shartida to'lov amalga oshirilishini bildiradigan hisob-kitob shakli.", source: "Fuqarolik kodeksi" },
    { term: "Inkasso", definition: "Bank orqali pul mablag'larini undirish uchun hisob-kitob topshirig'i asosida amalga oshiriladigan operatsiya.", source: "Fuqarolik kodeksi" },
    { term: "Chek", definition: "Chek beruvchining bankka unda ko'rsatilgan summani chek egasiga to'lash haqidagi shartsiz farmoyishini o'z ichiga olgan qimmatli qog'oz.", source: "Fuqarolik kodeksi" },
    { term: "Obligatsiya", definition: "Egasining uni chiqargan shaxsdan nominal qiymatini va belgilangan foizini olish huquqini tasdiqlovchi qarz qimmatli qog'ozi.", source: "Qimmatli qog'ozlar bozori to'g'risidagi qonun" },
    { term: "Aksiya", definition: "Aksiyadorlik jamiyati foydasidan dividend olish, uni boshqarishda ishtirok etish va uning mol-mulkidan ulush olish huquqini tasdiqlovchi qimmatli qog'oz.", source: "Fuqarolik kodeksi" },
    { term: "Fond birjasi", definition: "Qimmatli qog'ozlar bilan tashkillashtirilgan savdolarni amalga oshirish uchun mo'ljallangan tashkilot.", source: "Qimmatli qog'ozlar bozori to'g'risidagi qonun" },

    // ==================== TIJORAT VA KORPORATIV HUQUQ ====================
    { term: "Mas'uliyati cheklangan jamiyat", definition: "Ustav kapitali ulushlarga bo'lingan, qatnashchilari uning majburiyatlari bo'yicha shaxsan javob bermaydigan tijorat tashkiloti.", source: "Fuqarolik kodeksi va MChJ to'g'risidagi qonun" },
    { term: "Yakka tartibdagi tadbirkor", definition: "Yuridik shaxs tashkil etmasdan tadbirkorlik faoliyatini amalga oshirayotgan, davlat ro'yxatidan o'tgan jismoniy shaxs.", source: "Fuqarolik kodeksi" },
    { term: "Filial", definition: "Yuridik shaxsning joylashgan joyidan tashqarida bo'lib, uning barcha yoki bir qismi funksiyalarini bajaradigan alohida bo'linmasi.", source: "Fuqarolik kodeksi" },
    { term: "Vakolatxona", definition: "Yuridik shaxsning manfaatlarini boshqa joyda ifodalash va himoya qilish uchun tashkil etilgan alohida bo'linmasi.", source: "Fuqarolik kodeksi" },
    { term: "Ustav", definition: "Yuridik shaxsning tashkiliy-huquqiy asoslarini, maqsad va vazifalarini belgilaydigan asosiy ta'sis hujjati.", source: "Fuqarolik kodeksi" },
    { term: "Muassis", definition: "Yuridik shaxsni tashkil etishda ishtirok etgan va unga mulk qo'shgan shaxs.", source: "Fuqarolik kodeksi" },
    { term: "Fiduciar burch", definition: "Boshqaruv organi a'zosining yuridik shaxs manfaatlarini vijdonan va oqilona himoya qilish majburiyati.", source: "Fuqarolik kodeksi va Aksiyadorlik jamiyatlari to'g'risidagi qonun" },
    { term: "Manfaatlar to'qnashuvi", definition: "Mansabdor yoki boshqaruvchi shaxsning shaxsiy manfaati uning xizmat vazifalarini xolisona bajarishiga ta'sir qilishi mumkin bo'lgan vaziyat.", source: "Korrupsiyaga qarshi kurashish to'g'risidagi qonun" },
    { term: "Auditorlik tekshiruvi", definition: "Yuridik shaxsning moliyaviy hisobotini mustaqil auditor tomonidan tekshirish jarayoni.", source: "Auditorlik faoliyati to'g'risidagi qonun" },
    { term: "Moliyaviy hisobot", definition: "Korxonaning muayyan davrdagi moliyaviy holati va faoliyat natijalarini aks ettiruvchi rasmiy hujjatlar majmui.", source: "Buxgalteriya hisobi to'g'risidagi qonun" },
    { term: "Reorganizatsiya", definition: "Yuridik shaxsning qo'shilish, qo'shib olish, bo'linish, ajralib chiqish yoki o'zgartirish yo'li bilan tugatilishi yoki tashkil etilishi.", source: "Fuqarolik kodeksi" },
    { term: "Tugatish komissiyasi", definition: "Yuridik shaxsni tugatish jarayonida uning ishlarini boshqarish uchun tayinlangan organ.", source: "Fuqarolik kodeksi" },
    { term: "Ustav fondi", definition: "Yuridik shaxs tashkil etilganda muassislar tomonidan qo'shiladigan boshlang'ich mablag'lar yig'indisi.", source: "Fuqarolik kodeksi" },
    { term: "Korporativ boshqaruv", definition: "Aksiyadorlik jamiyati faoliyatini boshqarish tizimi bo'lib, aksiyadorlar, kuzatuv kengashi va ijroiya organi o'rtasidagi munosabatlarni tartibga soladi.", source: "Aksiyadorlik jamiyatlari to'g'risidagi qonun" },
    { term: "Kuzatuv kengashi", definition: "Aksiyadorlik jamiyatining faoliyatiga umumiy rahbarlikni amalga oshiruvchi saylab qo'yiladigan organ.", source: "Aksiyadorlik jamiyatlari to'g'risidagi qonun" },
    { term: "Franshiza (kompleks tadbirkorlik litsenziyasi)", definition: "Bir taraf ikkinchi tarafga o'z tovar belgisi, biznes-modeli va bilimlaridan haq evaziga foydalanish huquqini beradigan shartnoma.", source: "Fuqarolik kodeksi" },

    // ==================== INTELLEKTUAL MULK HUQUQI ====================
    { term: "Ixtiro", definition: "Texnika sohasidagi yangi va sanoatda qo'llash mumkin bo'lgan texnik yechim.", source: "Ixtirolar, foydali modellar va sanoat namunalari to'g'risidagi qonun" },
    { term: "Foydali model", definition: "Mehnat qurollari va ishlab chiqarish vositalariga tegishli yangi va sanoatda qo'llash mumkin bo'lgan konstruktiv yechim.", source: "Ixtirolar, foydali modellar va sanoat namunalari to'g'risidagi qonun" },
    { term: "Sanoat namunasi", definition: "Buyumning tashqi ko'rinishini belgilovchi badiiy-konstruktorlik yechimi.", source: "Ixtirolar, foydali modellar va sanoat namunalari to'g'risidagi qonun" },
    { term: "Qo'shni huquqlar", definition: "Ijrochilar, fonogramma ishlab chiqaruvchilar va translyatsiya tashkilotlarining o'z faoliyat natijalariga bo'lgan huquqlari.", source: "Mualliflik huquqi va turdosh huquqlar to'g'risidagi qonun" },
    { term: "Nou-xau (ishlab chiqarish siri)", definition: "Ishlab chiqarish, texnika, boshqaruv yoki moliyaviy faoliyat sohasidagi maxfiy tijorat ahamiyatiga ega ma'lumotlar.", source: "Fuqarolik kodeksi" },
    { term: "Litsenziya shartnomasi", definition: "Huquq egasi (litsenziar) boshqa shaxsga (litsenziat) intellektual mulk obyektidan foydalanish huquqini beradigan shartnoma.", source: "Fuqarolik kodeksi" },
    { term: "Plagiat", definition: "Boshqa shaxsning intellektual mulk obyektini o'zinikidek ko'rsatib, mualliflikni g'ayriqonuniy o'zlashtirish.", source: "Mualliflik huquqi va turdosh huquqlar to'g'risidagi qonun" },
    { term: "Geografik ko'rsatkich", definition: "Tovarning muayyan hududga xos sifat yoki xususiyatlarini bildiruvchi nom yoki belgi.", source: "Fuqarolik kodeksi" },

    // ==================== JINOYAT HUQUQI ====================
    { term: "Ayblanuvchi", definition: "Uning jinoyat sodir etganligi to'g'risida yetarli dalillar mavjud bo'lib, jinoyat ishi bo'yicha ayblov qo'yilgan shaxs.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Sudlanuvchi", definition: "Ish sud tomonidan ko'rib chiqilishga qabul qilingandan keyingi bosqichda ayblanuvchi ega bo'ladigan protsessual maqom.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Jabrlanuvchi", definition: "Jinoyat natijasida jismoniy, mulkiy yoki ma'naviy zarar ko'rgan deb topilgan shaxs.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Qasddan sodir etilgan jinoyat", definition: "Shaxs o'z qilmishining ijtimoiy xavfliligini anglab, oqibatini istagan yoki unga yo'l qo'ygan holda sodir etgan jinoyat.", source: "Jinoyat kodeksi" },
    { term: "Ehtiyotsizlik oqibatida sodir etilgan jinoyat", definition: "Shaxs o'z qilmishining oqibatlarini oldindan ko'ra bilmagan yoki yengiltaklik bilan oldini olish mumkin deb hisoblagan jinoyat.", source: "Jinoyat kodeksi" },
    { term: "Jinoyatga tayyorgarlik", definition: "Jinoyat sodir etish uchun shart-sharoit yaratish yoki vositalarni izlab topish bosqichi.", source: "Jinoyat kodeksi" },
    { term: "Jinoyatga suiqasd qilish", definition: "Jinoyatni bevosita sodir etishga qaratilgan, biroq shaxsga bog'liq bo'lmagan sabablarga ko'ra oxiriga yetkazilmagan harakat.", source: "Jinoyat kodeksi" },
    { term: "O'z ixtiyori bilan jinoyatdan voz kechish", definition: "Shaxsning jinoyatni oxiriga yetkazish imkoniyati bo'la turib undan ixtiyoriy ravishda voz kechishi.", source: "Jinoyat kodeksi" },
    { term: "Sherikchilikda jinoyat", definition: "Ikki yoki undan ortiq shaxsning birgalikda qasddan jinoyat sodir etishda ishtirok etishi.", source: "Jinoyat kodeksi" },
    { term: "Tashkilotchi (jinoyatda)", definition: "Jinoyat sodir etishni tashkil qilgan yoki uni boshqargan, shuningdek jinoiy guruh yoki uyushma tuzgan shaxs.", source: "Jinoyat kodeksi" },
    { term: "Ijrochi (jinoyatda)", definition: "Jinoyatni bevosita sodir etgan yoki uning sodir etilishida boshqa shaxslar bilan birgalikda bevosita ishtirok etgan shaxs.", source: "Jinoyat kodeksi" },
    { term: "Zarur mudofaa", definition: "Shaxsning o'ziga yoki boshqa shaxsga qilinayotgan hujumdan himoyalanish maqsadida hujumkorga zarar yetkazishi, jinoyat deb topilmaydigan holat.", source: "Jinoyat kodeksi" },
    { term: "Haddan tashqari zarur mudofaa", definition: "Mudofaalanuvchining hujum xavfi va xarakteriga aniq mos kelmaydigan darajada zarar yetkazishi.", source: "Jinoyat kodeksi" },
    { term: "Favqulodda zaruriyat", definition: "Boshqa yo'l bilan bartaraf etib bo'lmaydigan xavfni yo'qotish uchun kamroq zarar yetkazish orqali ko'proq zararning oldini olish holati.", source: "Jinoyat kodeksi" },
    { term: "Jinoiy javobgarlikni istisno etuvchi holatlar", definition: "Tashqi ko'rinishidan jinoyat belgilariga ega bo'lsa-da, qonunda ko'rsatilgan sabablarga ko'ra jazolanmaydigan qilmishlar.", source: "Jinoyat kodeksi" },
    { term: "Jazoni yengillashtiruvchi holatlar", definition: "Jinoyat sodir etilishida qatnashgan omillar bo'lib, sud tomonidan jazo tayinlashda hisobga olinib, uni yengillashtiruvchi holatlar.", source: "Jinoyat kodeksi" },
    { term: "Jazoni og'irlashtiruvchi holatlar", definition: "Jinoyatning ijtimoiy xavflilik darajasini oshiruvchi va jazoni og'irlashtiruvchi holatlar.", source: "Jinoyat kodeksi" },
    { term: "Retsidiv", definition: "Ilgari qasddan jinoyat sodir etganligi uchun sudlangan shaxsning yangi qasddan jinoyat sodir etishi.", source: "Jinoyat kodeksi" },
    { term: "Sudlanganlik", definition: "Shaxsning hukm chiqarilgan paytdan boshlab sudlanganligi bekor qilingunga yoki olib tashlangunga qadar davom etadigan huquqiy holati.", source: "Jinoyat kodeksi" },
    { term: "Jazoni ijro etishdan shartli muddatdan ilgari ozod qilish", definition: "Mahkumning jazoni haqiqatda o'tab bo'lib, tuzalganligi tan olingandan so'ng jazoni yanada o'tashdan ozod etilishi.", source: "Jinoyat-ijroiya kodeksi" },
    { term: "Ozodlikni cheklash", definition: "Mahkumni jamiyatdan izolyatsiya qilmasdan, uning huquqlariga nisbatan maxsus nazorat va cheklovlar qo'llash jazo turi.", source: "Jinoyat kodeksi" },
    { term: "Majburiy ishlar", definition: "Mahkumning asosiy ish yoki o'qish joyidan bo'sh vaqtida jamiyat foydasiga bepul ish bajarishi jazo turi.", source: "Jinoyat kodeksi" },
    { term: "Islohiy ishlar", definition: "Mahkumning ish joyida ishlashni davom ettirgan holda daromadining bir qismi davlat foydasiga undirilishi jazo turi.", source: "Jinoyat kodeksi" },
    { term: "O'g'irlik", definition: "Boshqa birovning mulkini yashirincha talon-taroj qilish.", source: "Jinoyat kodeksi" },
    { term: "Talonchilik", definition: "Boshqa birovning mulkini ochiqchasiga talon-taroj qilish.", source: "Jinoyat kodeksi" },
    { term: "Bosqinchilik", definition: "Boshqa birovning mulkini talon-taroj qilish maqsadida hayot yoki sog'liq uchun xavfli zo'ravonlik ishlatib yoki shu bilan tahdid qilib hujum qilish.", source: "Jinoyat kodeksi" },
    { term: "Firibgarlik", definition: "Ishonchni suiiste'mol qilish yoki aldash yo'li bilan boshqa birovning mulkini yoki mulkka bo'lgan huquqini egallab olish.", source: "Jinoyat kodeksi" },
    { term: "Tovlamachilik", definition: "Boshqa birovning mulkini yoki mulkiy huquqini berishni yoxud mulkiy tusdagi harakatlarni amalga oshirishni zo'rlik ishlatish bilan qo'rqitib talab qilish.", source: "Jinoyat kodeksi" },
    { term: "O'zlashtirish yoki isrof qilish", definition: "Boshqa birovning mol-mulkini uni ishonib topshirgan shaxs tomonidan g'ayriqonuniy egallab olinishi yoki sarflab yuborilishi.", source: "Jinoyat kodeksi" },
    { term: "Poraxo'rlik", definition: "Mansabdor shaxsning o'z xizmat vakolatlaridan foydalangan holda pora olishi va berishi bilan bog'liq jinoyat.", source: "Jinoyat kodeksi" },
    { term: "Kontrabanda", definition: "Tovar va boshqa qimmatliklarni bojxona nazoratidan yashirib yoki uni chetlab o'tib davlat chegarasidan olib o'tish.", source: "Jinoyat kodeksi" },
    { term: "Giyohvand moddalarni noqonuniy muomalaga kiritish", definition: "Giyohvand vositalar va psixotrop moddalarni qonunga xilof ravishda ishlab chiqarish, saqlash, tashish yoki sotish.", source: "Jinoyat kodeksi" },
    { term: "Terrorizm", definition: "Aholini qo'rqitish yoki davlat organlariga bosim o'tkazish maqsadida portlash, o't qo'yish yoki boshqa umumxavfli harakatlarni sodir etish.", source: "Jinoyat kodeksi" },
    { term: "Insonni olib sotish", definition: "Insonni ekspluatatsiya qilish maqsadida jalb qilish, tashish, topshirish, yashirish yoki qabul qilib olish.", source: "Jinoyat kodeksi" },
    { term: "Umrbod ozodlikdan mahrum qilish", definition: "O'ta og'ir jinoyatlar uchun tayinlanadigan, mahkumni cheksiz muddatga ozodlikdan mahrum etuvchi eng og'ir jazo turi.", source: "Jinoyat kodeksi" },

    // ==================== JINOYAT-PROTSESSUAL HUQUQ ====================
    { term: "Jinoyat ishi qo'zg'atish", definition: "Vakolatli organning jinoyat alomatlari mavjudligi to'g'risida qaror qabul qilishi bilan boshlanadigan protsessual bosqich.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Tergov", definition: "Jinoyat ishi bo'yicha haqiqatni aniqlash maqsadida dalillarni to'plash, tekshirish va baholash bo'yicha protsessual faoliyat.", source: "Jinoyat-protsessual kodeksi" },
    { term: "So'roq qilish", definition: "Guvoh, jabrlanuvchi, gumon qilinuvchi yoki ayblanuvchidan ish bo'yicha ahamiyatga molik ma'lumotlarni olish tergov harakati.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Qidiruv", definition: "Jinoyat ishi bo'yicha ahamiyatga molik ashyo yoki hujjatlarni topish maqsadida o'tkaziladigan tergov harakati.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Ko'zdan kechirish", definition: "Voqea joyi, ashyo yoki hujjatlarni bevosita kuzatish orqali dalillarni aniqlash tergov harakati.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Ehtiyot chorasi", definition: "Gumon qilinuvchi yoki ayblanuvchining tergov va sudda ishtirok etishini ta'minlash uchun qo'llaniladigan majburlov chorasi.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Qamoqqa olish", definition: "Gumon qilinuvchi yoki ayblanuvchini sud qarori bilan qamoqxonada vaqtincha ushlab turish ehtiyot chorasi.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Garov (ehtiyot chorasi sifatida)", definition: "Ayblanuvchining protsessual majburiyatlarni bajarishini ta'minlash uchun pul yoki qimmatli qog'ozlarni depozitga qo'yish ehtiyot chorasi.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Ish yuritishni tugatish", definition: "Jinoyat ishi bo'yicha qonunda nazarda tutilgan asoslar mavjud bo'lganda tergov yoki sud jarayonini bekor qilish.", source: "Jinoyat-protsessual kodeksi" },
    { term: "Prokuror nazorati", definition: "Prokuratura organlarining tergov va surishtiruv organlari faoliyati ustidan qonuniylikni ta'minlash bo'yicha olib boradigan nazorati.", source: "Prokuratura to'g'risidagi qonun" },
    { term: "Kassatsiya", definition: "Qonuniy kuchga kirgan sud qarorlarini qonun buzilishi asosida qayta ko'rib chiqish protsessual instituti.", source: "Protsessual kodekslar" },

    // ==================== MA'MURIY HUQUQ ====================
    { term: "Ma'muriy huquqbuzarlik", definition: "Shaxsiyatga, fuqarolarning huquq va erkinliklariga, mulkka yoki boshqaruv tartibiga tajovuz qiluvchi, qonunda javobgarlik nazarda tutilgan g'ayriqonuniy, aybli qilmish.", source: "Ma'muriy javobgarlik to'g'risidagi kodeks" },
    { term: "Ma'muriy jarima", definition: "Ma'muriy huquqbuzarlik sodir etgan shaxsga nisbatan qo'llaniladigan pul undirish shaklidagi jazo chorasi.", source: "Ma'muriy javobgarlik to'g'risidagi kodeks" },
    { term: "Ma'muriy hibsga olish", definition: "Ma'muriy huquqbuzarlik uchun qo'llaniladigan, shaxsni qisqa muddatga ozodlikdan mahrum qiluvchi jazo turi.", source: "Ma'muriy javobgarlik to'g'risidagi kodeks" },
    { term: "Ogohlantirish (ma'muriy jazo sifatida)", definition: "Huquqbuzarga nisbatan yozma shaklda qo'llaniladigan eng yengil ma'muriy jazo turi.", source: "Ma'muriy javobgarlik to'g'risidagi kodeks" },
    { term: "Mansabdor shaxs", definition: "Davlat organi yoki tashkilotda tashkiliy-farmoyish yoxud ma'muriy-xo'jalik vazifalarini doimiy, vaqtinchalik yoki maxsus vakolat bo'yicha bajaruvchi shaxs.", source: "Jinoyat kodeksi va Ma'muriy javobgarlik to'g'risidagi kodeks" },
    { term: "Ijro etuvchi hokimiyat", definition: "Qonunlarni ijro etish va davlat boshqaruvini amalga oshiruvchi davlat hokimiyati tarmog'i.", source: "Konstitutsiyaviy huquq" },
    { term: "Vazirlar Mahkamasi", definition: "O'zbekiston Respublikasi ijro etuvchi hokimiyatini amalga oshiruvchi oliy davlat boshqaruvi organi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Hokim", definition: "Viloyat, tuman yoki shahar hududida ijro etuvchi hokimiyatni amalga oshiruvchi mansabdor shaxs.", source: "Mahalliy davlat hokimiyati to'g'risidagi qonun" },
    { term: "Ma'muriy nazorat", definition: "Vakolatli davlat organlarining qonun va boshqa normativ hujjatlar ijrosi ustidan olib boradigan tekshiruvi.", source: "Ma'muriy huquq" },
    { term: "Ma'muriy shikoyat", definition: "Fuqaro yoki yuridik shaxsning davlat organi yoki mansabdor shaxs harakati (harakatsizligi) ustidan yuqori organ yoki sudga qilgan murojaati.", source: "Ma'muriy protsessual kodeksi" },
    { term: "Ma'muriy sud ishi yuritish", definition: "Fuqarolarning davlat organlari va mansabdor shaxslar harakatlari ustidan qilgan shikoyatlarini sudda ko'rib chiqish tartibi.", source: "Ma'muriy protsessual kodeksi" },
    { term: "Davlat nazorati", definition: "Davlat organlarining jismoniy va yuridik shaxslar faoliyatining qonunchilikka muvofiqligini tekshirish bo'yicha olib boradigan ishi.", source: "Nazorat faoliyati to'g'risidagi qonun" },

    // ==================== KONSTITUTSIYAVIY HUQUQ ====================
    { term: "Konstitutsiyaviy tuzum", definition: "Davlat va jamiyat tashkil topishining Konstitutsiya bilan mustahkamlangan asosiy tamoyillari tizimi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Hokimiyatlar taqsimoti", definition: "Davlat hokimiyatining qonun chiqaruvchi, ijro etuvchi va sud hokimiyatiga bo'linishi tamoyili.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Referendum", definition: "Muhim davlat va jamiyat masalalarini fuqarolarning umumiy ovoz berishi orqali hal etish shakli.", source: "Referendum to'g'risidagi qonun" },
    { term: "Saylov huquqi", definition: "Fuqarolarning davlat hokimiyati organlariga saylash va saylanish konstitutsiyaviy huquqi.", source: "Saylov kodeksi" },
    { term: "Oliy Majlis", definition: "O'zbekiston Respublikasining qonun chiqaruvchi hokimiyatini amalga oshiruvchi oliy davlat vakillik organi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Qonunchilik palatasi", definition: "Oliy Majlisning quyi palatasi bo'lib, deputatlardan tashkil topgan qonun chiqaruvchi organ.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Senat", definition: "Oliy Majlisning hududiy vakillik palatasi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Konstitutsiyaviy sud", definition: "Qonun va boshqa normativ hujjatlarning Konstitutsiyaga muvofiqligini tekshiruvchi sud organi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Mahalliy o'zini o'zi boshqarish", definition: "Fuqarolarning mahalla darajasida o'z hayotiy masalalarini mustaqil hal qilish tizimi.", source: "Fuqarolarning o'zini o'zi boshqarish organlari to'g'risidagi qonun" },
    { term: "Fuqarolar yig'ini", definition: "Mahallada yashovchi fuqarolarning o'z-o'zini boshqarish organi bo'lib, mahalliy ahamiyatga molik masalalarni hal qiladi.", source: "Fuqarolarning o'zini o'zi boshqarish organlari to'g'risidagi qonun" },
    { term: "Konstitutsiyaviy nazorat", definition: "Normativ hujjatlarning Konstitutsiyaga muvofiqligini tekshirish bo'yicha davlat faoliyati.", source: "Konstitutsiyaviy huquq" },
    { term: "Davlat mustaqilligi", definition: "Davlatning boshqa davlatlarga qaram bo'lmagan holda o'z ichki va tashqi siyosatini mustaqil belgilash huquqi.", source: "O'zbekiston Respublikasi Konstitutsiyasi" },
    { term: "Prezident farmoni", definition: "Davlat boshlig'i tomonidan chiqariladigan, umummajburiy kuchga ega bo'lgan normativ-huquqiy hujjat.", source: "Normativ-huquqiy hujjatlar to'g'risidagi qonun" },

    // ==================== MEHNAT HUQUQI ====================
    { term: "Mehnat shartnomasi", definition: "Xodim bilan ish beruvchi o'rtasida tuzilgan, mehnat funksiyasini bajarish shartlarini belgilovchi kelishuv.", source: "Mehnat kodeksi" },
    { term: "Ish beruvchi", definition: "Xodim bilan mehnat shartnomasi tuzgan yuridik yoki jismoniy shaxs.", source: "Mehnat kodeksi" },
    { term: "Mehnat kitobchasi", definition: "Xodimning mehnat faoliyati va staji to'g'risidagi asosiy hujjati.", source: "Mehnat kodeksi" },
    { term: "Mehnat haqi", definition: "Xodimning bajargan mehnati uchun ish beruvchi tomonidan to'lanadigan pul mukofoti.", source: "Mehnat kodeksi" },
    { term: "Eng kam ish haqi", definition: "Qonun bilan belgilangan, undan past bo'lmagan miqdorda to'lanishi shart bo'lgan mehnat haqi darajasi.", source: "Mehnat kodeksi" },
    { term: "Mehnat sharoiti", definition: "Xodimning mehnat funksiyasini bajarishiga ta'sir etuvchi ish joyi, ish vaqti va boshqa omillar majmui.", source: "Mehnat kodeksi" },
    { term: "Mehnat muhofazasi", definition: "Xodimlarning mehnat faoliyati jarayonida hayoti va sog'lig'ini saqlashga qaratilgan huquqiy, ijtimoiy-iqtisodiy va tashkiliy chora-tadbirlar tizimi.", source: "Mehnat kodeksi" },
    { term: "Mehnat ta'tili", definition: "Xodimning ish joyi va o'rtacha ish haqi saqlangan holda dam olish uchun beriladigan muddat.", source: "Mehnat kodeksi" },
    { term: "Kasaba uyushmasi", definition: "Xodimlarning mehnat va ijtimoiy-iqtisodiy huquqlarini himoya qilish maqsadida tuzgan ixtiyoriy jamoat tashkiloti.", source: "Kasaba uyushmalari to'g'risidagi qonun" },
    { term: "Jamoa shartnomasi", definition: "Ish beruvchi va xodimlar vakillik organi o'rtasida mehnat sharoitlarini tartibga soluvchi kelishuv.", source: "Mehnat kodeksi" },
    { term: "Mehnat nizosi", definition: "Ish beruvchi va xodim o'rtasida mehnat munosabatlariga oid masalalar yuzasidan yuzaga keladigan kelishmovchilik.", source: "Mehnat kodeksi" },
    { term: "Ishdan bo'shatish", definition: "Mehnat shartnomasining ish beruvchi tashabbusi yoki qonunda nazarda tutilgan boshqa asoslar bilan bekor qilinishi.", source: "Mehnat kodeksi" },
    { term: "Ishga tiklash", definition: "Noqonuniy ishdan bo'shatilgan xodimning sud qarori bilan avvalgi ish joyiga qaytarilishi.", source: "Mehnat kodeksi" },
    { term: "Ish vaqti", definition: "Xodim mehnat shartnomasi va ichki tartib qoidalariga muvofiq o'z mehnat funksiyalarini bajarishi lozim bo'lgan vaqt davri.", source: "Mehnat kodeksi" },
    { term: "Intizomiy jazo", definition: "Xodim mehnat intizomini buzganligi uchun ish beruvchi tomonidan qo'llaniladigan chora.", source: "Mehnat kodeksi" },
    { term: "Sinov muddati", definition: "Xodimning bajaradigan ishga muvofiqligini aniqlash uchun mehnat shartnomasida belgilanadigan dastlabki davr.", source: "Mehnat kodeksi" },

    // ==================== OILA HUQUQI ====================
    { term: "Nikoh", definition: "Erkak va ayol o'rtasida qonunda belgilangan tartibda tuziladigan, oila huquq va majburiyatlarini yuzaga keltiruvchi ittifoq.", source: "Oila kodeksi" },
    { term: "Nikoh shartnomasi", definition: "Er-xotinning nikoh davomidagi va bekor qilingan taqdirdagi mulkiy huquq hamda majburiyatlarini belgilaydigan kelishuv.", source: "Oila kodeksi" },
    { term: "Nikohni bekor qilish", definition: "Er-xotin o'rtasidagi nikoh munosabatlarining fuqarolik holati dalolatnomalarini yozish organlari yoki sud tomonidan tugatilishi.", source: "Oila kodeksi" },
    { term: "Ota-onalik huquqlari", definition: "Ota-onaning farzandlarini tarbiyalash, ta'minlash va ularning manfaatlarini himoya qilish bo'yicha huquq va majburiyatlari.", source: "Oila kodeksi" },
    { term: "Ota-onalik huquqidan mahrum etish", definition: "Ota yoki onani bolaga nisbatan majburiyatlarini bajarmaganligi uchun sud tomonidan ota-onalik huquqlaridan mahrum qilish.", source: "Oila kodeksi" },
    { term: "Farzandlikka olish (asrab olish)", definition: "Ota-onasiz qolgan bolani boshqa shaxs tomonidan o'z farzandi sifatida tarbiyalash va ta'minlash uchun qabul qilib olish.", source: "Oila kodeksi" },
    { term: "Patronat tarbiya", definition: "Ota-ona qaramog'idan mahrum bo'lgan bolani muayyan haq evaziga oilaga vaqtinchalik tarbiyaga berish shakli.", source: "Oila kodeksi" },
    { term: "Nikohsiz tug'ilgan bola", definition: "Ota-onasi rasmiy nikohda bo'lmagan holda tug'ilgan, ammo qonunda belgilangan tartibda otalik aniqlangan bola.", source: "Oila kodeksi" },
    { term: "Fuqarolik holati dalolatnomalari", definition: "Tug'ilish, nikoh, ajralish, farzandlikka olish va vafot kabi voqealarni davlat tomonidan rasmiy qayd etish hujjatlari.", source: "Fuqarolik holati dalolatnomalarini davlat ro'yxatidan o'tkazish to'g'risidagi qonun" },
    { term: "Oilaviy zo'ravonlik", definition: "Oila a'zolaridan biri tomonidan boshqasiga nisbatan jismoniy, psixologik yoki iqtisodiy zo'rlik ishlatish.", source: "Ayollarni tazyiq va zo'ravonlikdan himoya qilish to'g'risidagi qonun" },

    // ==================== SOLIQ VA MOLIYA HUQUQI ====================
    { term: "Soliq to'lovchi", definition: "Qonunga muvofiq soliq va yig'imlarni to'lash majburiyati yuklatilgan jismoniy yoki yuridik shaxs.", source: "Soliq kodeksi" },
    { term: "Soliq solinadigan baza", definition: "Soliq miqdorini hisoblash uchun asos bo'lib xizmat qiluvchi qiymat yoki fizik ko'rsatkich.", source: "Soliq kodeksi" },
    { term: "Soliq stavkasi", definition: "Soliq solinadigan bazaning bir birligiga to'g'ri keladigan soliq miqdori.", source: "Soliq kodeksi" },
    { term: "Qo'shilgan qiymat solig'i", definition: "Tovar, ish va xizmatlarning har bir ishlab chiqarish yoki muomala bosqichida qo'shilgan qiymatdan olinadigan bilvosita soliq.", source: "Soliq kodeksi" },
    { term: "Aktsiz solig'i", definition: "Ayrim turdagi tovarlarga (aksiz mahsulotlariga) belgilanadigan bilvosita soliq turi.", source: "Soliq kodeksi" },
    { term: "Foyda solig'i", definition: "Yuridik shaxsning sof foydasidan undiriladigan to'g'ridan-to'g'ri soliq turi.", source: "Soliq kodeksi" },
    { term: "Mol-mulk solig'i", definition: "Jismoniy va yuridik shaxslarga tegishli ko'chmas mulk qiymatidan olinadigan mahalliy soliq turi.", source: "Soliq kodeksi" },
    { term: "Yer solig'i", definition: "Yer uchastkasidan foydalanganlik uchun undiriladigan soliq turi.", source: "Soliq kodeksi" },
    { term: "Soliq deklaratsiyasi", definition: "Soliq to'lovchining olingan daromadlari va soliq majburiyatlari to'g'risida soliq organiga taqdim etadigan rasmiy hisoboti.", source: "Soliq kodeksi" },
    { term: "Soliq nazorati", definition: "Soliq organlarining soliq to'lovchilar tomonidan qonunchilikka rioya etilishini tekshirish faoliyati.", source: "Soliq kodeksi" },
    { term: "Soliq qarzi", definition: "Soliq to'lovchining belgilangan muddatda to'lanmagan soliq va boshqa majburiy to'lovlar bo'yicha majburiyati.", source: "Soliq kodeksi" },
    { term: "Ikki tomonlama soliqqa tortishning oldini olish", definition: "Bir xil daromad ikki davlat tomonidan qayta soliqqa tortilishining oldini olish maqsadidagi xalqaro shartnoma mexanizmi.", source: "Xalqaro shartnomalar" },
    { term: "Markaziy bank", definition: "Davlatning pul-kredit siyosatini amalga oshiruvchi, milliy valyuta emissiyasini nazorat qiluvchi bosh bank.", source: "O'zbekiston Respublikasi Markaziy banki to'g'risidagi qonun" },
    { term: "Pul-kredit siyosati", definition: "Markaziy bank tomonidan narxlar barqarorligini ta'minlash maqsadida amalga oshiriladigan chora-tadbirlar majmui.", source: "O'zbekiston Respublikasi Markaziy banki to'g'risidagi qonun" },
    { term: "Legalizatsiya (pul yuvish)", definition: "Jinoiy yo'l bilan olingan daromadlarni qonuniy manbadan kelib chiqqandek ko'rsatishga qaratilgan g'ayriqonuniy harakat.", source: "Jinoiy daromadlarni legalizatsiya qilishga qarshi kurashish to'g'risidagi qonun" },
    { term: "Moliyaviy monitoring", definition: "Shubhali moliyaviy operatsiyalarni aniqlash va ular to'g'risida vakolatli organga xabar berish tizimi.", source: "Jinoiy daromadlarni legalizatsiya qilishga qarshi kurashish to'g'risidagi qonun" },

    // ==================== XALQARO HUQUQ ====================
    { term: "Xalqaro shartnoma", definition: "Davlatlar yoki xalqaro huquq subyektlari o'rtasida yozma shaklda tuzilgan, xalqaro huquq bilan tartibga solinadigan kelishuv.", source: "Xalqaro shartnomalar to'g'risidagi qonun" },
    { term: "Suverenitet", definition: "Davlatning o'z hududida oliy hokimiyatga ega bo'lishi va xalqaro maydonda mustaqil ish yuritishi.", source: "Xalqaro huquq" },
    { term: "Diplomatik vakolatxona", definition: "Bir davlatning ikkinchi davlat hududida uning manfaatlarini ifodalash uchun tashkil etilgan rasmiy vakillik organi.", source: "Xalqaro huquq" },
    { term: "Konsullik", definition: "Bir davlatning boshqa davlat hududida o'z fuqarolarining huquq va manfaatlarini himoya qilish uchun tashkil etilgan organi.", source: "Xalqaro huquq" },
    { term: "Xalqaro tashkilot", definition: "Davlatlar tomonidan xalqaro shartnoma asosida umumiy maqsadlarni amalga oshirish uchun tuzilgan tashkilot.", source: "Xalqaro huquq" },
    { term: "Fuqaroligi bo'lmagan shaxs (apatrid)", definition: "Hech bir davlatning fuqaroligiga ega bo'lmagan shaxs.", source: "Fuqarolik to'g'risidagi qonun" },
    { term: "Qochqin", definition: "Ta'qib qilinish xavfi tufayli o'z davlatini tark etib, boshqa davlatdan himoya so'ragan shaxs.", source: "Xalqaro huquq" },
    { term: "Repatriatsiya", definition: "Shaxsning o'z fuqaroligi yoki millatiga mansub bo'lgan davlatga qaytarilishi.", source: "Xalqaro huquq" },
    { term: "Xalqaro xususiy huquq", definition: "Xorijiy element ishtirok etgan fuqarolik-huquqiy munosabatlarni tartibga soluvchi huquq sohasi.", source: "Fuqarolik kodeksi VI bo'limi" },
    { term: "Kollizion norma", definition: "Xorijiy element mavjud munosabatlarga qaysi davlat huquqi qo'llanilishini belgilovchi huquqiy norma.", source: "Xalqaro xususiy huquq" },
    { term: "Nyu-York konventsiyasi", definition: "Xorijiy hakamlik sudi qarorlarini tan olish va ijro etish to'g'risidagi 1958-yilgi xalqaro konventsiya.", source: "Xalqaro shartnoma" },
    { term: "Хalqaro tijorat arbitraji", definition: "Xalqaro tijorat nizolarini davlat sudlaridan tashqarida, tomonlar kelishuvi asosida hal qiluvchi hakamlik instituti.", source: "Xalqaro tijorat arbitraji to'g'risidagi qonun" },

    // ==================== YER VA EKOLOGIYA HUQUQI ====================
    { term: "Yer uchastkasi", definition: "Belgilangan chegaralarga ega, huquqiy maqomi aniqlangan yer yuzasining bir qismi.", source: "Yer kodeksi" },
    { term: "Yerdan doimiy foydalanish huquqi", definition: "Yuridik shaxslarga muddatsiz asosda beriladigan yer uchastkasidan foydalanish huquqi.", source: "Yer kodeksi" },
    { term: "Yer ijarasi", definition: "Yer uchastkasini haq evaziga vaqtincha foydalanishga berish shartnomasi.", source: "Yer kodeksi" },
    { term: "Qishloq xo'jaligi mo'ljallangan yerlar", definition: "Qishloq xo'jaligi ishlab chiqarishi uchun ajratilgan va shu maqsadda foydalaniladigan yerlar toifasi.", source: "Yer kodeksi" },
    { term: "Yer kadastri", definition: "Yer uchastkalari, ularning holati, sifati va huquqiy maqomi to'g'risidagi ma'lumotlar tizimi.", source: "Yer kadastri to'g'risidagi qonun" },
    { term: "Suv ob'ektlari", definition: "Yer usti va yer osti suvlarining tabiiy yoki sun'iy jamlanmalari.", source: "Suv va suvdan foydalanish to'g'risidagi qonun" },
    { term: "O'rmon fondi", definition: "O'rmon bilan qoplangan va o'rmon xo'jaligi uchun mo'ljallangan yerlar majmui.", source: "O'rmon kodeksi" },
    { term: "Qizil kitob", definition: "Yo'qolib ketish xavfi ostida turgan hayvon va o'simlik turlarining davlat tomonidan muhofaza qilinadigan ro'yxati.", source: "Hayvonot dunyosini muhofaza qilish va undan foydalanish to'g'risidagi qonun" },
    { term: "Chiqindilar", definition: "Ishlab chiqarish yoki iste'mol jarayonida hosil bo'lib, asl xususiyatini yo'qotgan moddiy qoldiqlar.", source: "Chiqindilar to'g'risidagi qonun" },
    { term: "Atrof-muhitga ta'sirni baholash", definition: "Xo'jalik faoliyati loyihasining atrof-muhitga ko'rsatishi mumkin bo'lgan ta'sirini oldindan aniqlash jarayoni.", source: "Ekologik ekspertiza to'g'risidagi qonun" },

    // ==================== BOJXONA VA TASHQI IQTISODIY FAOLIYAT ====================
    { term: "Bojxona nazorati", definition: "Bojxona organlarining tovar va transport vositalarining bojxona qoidalariga muvofiqligini tekshirish faoliyati.", source: "Bojxona kodeksi" },
    { term: "Bojxona to'lovlari", definition: "Tovarlarni bojxona chegarasidan olib o'tishda undiriladigan boj, soliq va yig'imlar majmui.", source: "Bojxona kodeksi" },
    { term: "Erkin muomala uchun chiqarish", definition: "Import qilinayotgan tovarlarni barcha bojxona to'lovlari to'langandan so'ng mamlakat ichki bozorida cheklovsiz muomalaga qo'yish rejimi.", source: "Bojxona kodeksi" },
    { term: "Tranzit rejimi", definition: "Tovarlarning bojxona to'lovlarisiz mamlakat hududi orqali boshqa davlatga olib o'tilishini nazarda tutuvchi bojxona rejimi.", source: "Bojxona kodeksi" },
    { term: "Bojxona ombori", definition: "Tovarlar bojxona nazorati ostida bojxona to'lovlari to'lanmasdan saqlanadigan joy.", source: "Bojxona kodeksi" },
    { term: "Eksport", definition: "Tovar, ish yoki xizmatlarni mamlakat hududidan chetga chiqarib sotish.", source: "Tashqi iqtisodiy faoliyat to'g'risidagi qonun" },
    { term: "Import", definition: "Tovar, ish yoki xizmatlarni boshqa davlatdan mamlakat hududiga olib kirish.", source: "Tashqi iqtisodiy faoliyat to'g'risidagi qonun" },
    { term: "Kvota", definition: "Muayyan tovarni eksport yoki import qilish miqdoriga davlat tomonidan qo'yiladigan cheklov.", source: "Tashqi iqtisodiy faoliyat to'g'risidagi qonun" },

    // ==================== BANKROTLIK VA TIJORAT NIZOLARI ====================
    { term: "To'lovga qobiliyatsizlik", definition: "Qarzdorning kreditorlar oldidagi pul majburiyatlarini yoki majburiy to'lovlarni belgilangan muddatda bajara olmasligi.", source: "To'lovga qobiliyatsizlik to'g'risidagi qonun" },
    { term: "Sudgacha sanatsiya", definition: "Qarzdorning to'lov qobiliyatini tiklash maqsadida bankrotlik ishi qo'zg'atilgunga qadar ko'riladigan chora-tadbirlar.", source: "To'lovga qobiliyatsizlik to'g'risidagi qonun" },
    { term: "Kuzatuv (bankrotlik protsedurasi)", definition: "Qarzdor mol-mulkining saqlanishini ta'minlash va uning moliyaviy holatini tahlil qilish maqsadida qo'llaniladigan bankrotlik protsedurasi.", source: "To'lovga qobiliyatsizlik to'g'risidagi qonun" },
    { term: "Tugatuvchi (bankrotlik ishida)", definition: "Bankrot deb topilgan qarzdorning mol-mulkini sotish va kreditorlar talablarini qondirish uchun tayinlangan shaxs.", source: "To'lovga qobiliyatsizlik to'g'risidagi qonun" },
    { term: "Kreditorlar yig'ilishi", definition: "Bankrotlik ishida qarzdorga nisbatan talablarga ega bo'lgan kreditorlarning umumiy manfaatlarini ifodalovchi organ.", source: "To'lovga qobiliyatsizlik to'g'risidagi qonun" },
    { term: "Navbatma-navbat qondirish", definition: "Bankrot qarzdor mol-mulki hisobidan kreditorlar talablarini qonunda belgilangan ustuvorlik tartibida qondirish.", source: "To'lovga qobiliyatsizlik to'g'risidagi qonun" },

    // ==================== NOTARIAT VA HUJJATLAR ====================
    { term: "Notarial harakat", definition: "Notarius tomonidan qonunda nazarda tutilgan tartibda amalga oshiriladigan huquqiy ahamiyatga molik rasmiy harakat.", source: "Notariat to'g'risidagi qonun" },
    { term: "Meros huquqi to'g'risidagi guvohnoma", definition: "Merosxo'rning meros mulkiga bo'lgan huquqini tasdiqlovchi notarial hujjat.", source: "Fuqarolik kodeksi va Notariat to'g'risidagi qonun" },
    { term: "Apostil", definition: "Xorijda foydalanish uchun mo'ljallangan rasmiy hujjatning haqiqiyligini xalqaro tartibda tasdiqlovchi maxsus shtamp.", source: "Xalqaro shartnoma (Gaaga konventsiyasi)" },
    { term: "Elektron hujjat", definition: "Elektron shaklda tuzilgan va elektron raqamli imzo bilan tasdiqlangan, qog'oz hujjat bilan bir xil yuridik kuchga ega hujjat.", source: "Elektron hujjat aylanishi to'g'risidagi qonun" },

    // ==================== HUQUQ NAZARIYASI VA UMUMIY TUSHUNCHALAR ====================
    { term: "Huquqiy norma", definition: "Davlat tomonidan o'rnatilgan yoki sanksiyalangan, umummajburiy xususiyatga ega xulq-atvor qoidasi.", source: "Huquq nazariyasi" },
    { term: "Huquq subyekti", definition: "Huquq va majburiyatlarga ega bo'lish qobiliyatiga ega shaxs yoki tashkilot.", source: "Huquq nazariyasi" },
    { term: "Huquqiy layoqat", definition: "Shaxsning fuqarolik huquq va majburiyatlariga ega bo'lish qobiliyati.", source: "Fuqarolik kodeksi" },
    { term: "Muomala layoqati", definition: "Shaxsning o'z harakatlari bilan fuqarolik huquqlarini amalga oshirish va majburiyatlarini yaratish qobiliyati.", source: "Fuqarolik kodeksi" },
    { term: "Huquqiy munosabat", definition: "Huquqiy norma bilan tartibga solingan, taraflarning o'zaro huquq va majburiyatlaridan iborat ijtimoiy munosabat.", source: "Huquq nazariyasi" },
    { term: "Huquqbuzarlik", definition: "Huquq normalariga zid bo'lgan, aybli va jamiyat uchun zararli qilmish.", source: "Huquq nazariyasi" },
    { term: "Yuridik javobgarlik", definition: "Huquqbuzarlik sodir etgan shaxsning davlat majburlovi asosida salbiy oqibatlarni o'z zimmasiga olishi.", source: "Huquq nazariyasi" },
    { term: "Huquqiy manba", definition: "Huquq normalarining tashqi ifoda shakli (qonun, kodeks, farmon va boshqalar).", source: "Huquq nazariyasi" },
    { term: "Analogiya", definition: "Muayyan munosabatni tartibga soluvchi aniq norma bo'lmagan hollarda shunga o'xshash munosabatni tartibga soluvchi normani qo'llash usuli.", source: "Fuqarolik kodeksi" },
    { term: "Retroaktivlik (qonunning teskari kuchi)", definition: "Qonunning u qabul qilingunga qadar yuzaga kelgan munosabatlarga nisbatan qo'llanilishi.", source: "Huquq nazariyasi" },
    { term: "Kodifikatsiya", definition: "Muayyan huquq sohasidagi normalarni tizimlashtirib, yagona kodeksga birlashtirish usuli.", source: "Huquq nazariyasi" },
    { term: "Imperativ norma", definition: "Taraflarning o'zaro kelishuvi bilan o'zgartirib bo'lmaydigan, qat'iy majburiy huquqiy norma.", source: "Huquq nazariyasi" },
    { term: "Dispozitiv norma", definition: "Taraflar boshqacha kelishuvga ega bo'lmagan hollardagina qo'llaniladigan, o'zgartirilishi mumkin bo'lgan huquqiy norma.", source: "Huquq nazariyasi" },

    // ==================== FUQAROLIK PROTSESSUAL HUQUQ ====================
    { term: "Javobgar", definition: "Fuqarolik ishi bo'yicha da'vogarning huquqi buzilgani da'vo qilinayotgan taraf.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Uchinchi shaxs", definition: "Fuqarolik ishida mustaqil talab bilan yoki taraflardan biriga qo'shilgan holda ishtirok etuvchi shaxs.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Sud buyrug'i", definition: "Bahsli bo'lmagan talablar bo'yicha sud tomonidan yagona shaxsning ishtirokisiz chiqariladigan qaror, bir vaqtning o'zida ijro hujjati hisoblanadi.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Sud ekspertizasi", definition: "Ish bo'yicha ahamiyatga molik masalalarni aniqlash uchun maxsus bilimga ega ekspert tomonidan o'tkaziladigan tekshiruv.", source: "Sud ekspertizasi to'g'risidagi qonun" },
    { term: "Dalolat berish", definition: "Guvohning ish yuzasidan bilgan holatlari to'g'risida sudga og'zaki yoki yozma ma'lumot berishi.", source: "Fuqarolik protsessual kodeksi" },
    { term: "Ijro varaqasi", definition: "Sud qarorini majburiy ijro etish uchun sud tomonidan beriladigan ijro hujjati.", source: "Sud ijrochilari to'g'risidagi qonun" },
