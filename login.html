<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Kirish — Huquq Ustoz</title>
<link rel="icon" type="image/jpeg" href="huquq.jpg">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
body{ background:#0f172a; color:white; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.login-card{ background:#111827; border:1px solid #333; padding:40px; border-radius:12px; width:90%; max-width:400px; text-align:center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.login-card h2{ color:#a855f7; margin-bottom:20px; font-size:24px; }
input{ width:100%; padding:12px 15px; background:#1f2937; border:1px solid #444; border-radius:8px; color:white; margin-bottom:15px; outline:none; font-size:16px; }
input:focus{ border-color:#a855f7; }
.btn{ width:100%; padding:12px; background:#7c3aed; border:none; border-radius:8px; color:white; font-weight:bold; font-size:16px; cursor:pointer; transition:.3s; }
.btn:hover{ background:#6d28d9; }
.error-msg{ color:#ef4444; margin-top:10px; font-size:14px; display:none; }
</style>
</head>
<body>

<div class="login-card">
  <h2>Admin Panelga Kirish</h2>
  <form id="login-form">
    <input type="password" id="admin-pass" placeholder="Parolni kiriting..." required autocomplete="current-password">
    <button type="submit" class="btn">Kirish</button>
  </form>
  <div id="error-text" class="error-msg">Parol noto'g'ri! Qayta urinib ko'ring.</div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const pass = document.getElementById('admin-pass').value.trim();
  const errorText = document.getElementById('error-text');

  // Parolni tekshirish (Standart parol: honorx7b)
  if (pass === 'admin123') {
    // Brauzer xotirasiga admin belgisini saqlash
    localStorage.setItem('isAdmin', 'true');
    
    // Admin sahifasiga o'tish
    window.location.href = 'admin.html';
  } else {
    errorText.style.display = 'block';
    document.getElementById('admin-pass').value = '';
  }
});
</script>

</body>
</html>
