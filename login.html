<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Kirish — Huquq Ustoz</title>
<link rel="icon" type="image/jpeg" href="huquq.jpg">

<!-- FontAwesome Ikonkalari -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-gradient: radial-gradient(circle at 50% 0%, #2e1065 0%, #0f172a 70%, #020617 100%);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.12);
  --primary-purple: #a855f7;
  --accent-cyan: #22d3ee;
  --error-red: #ef4444;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 40px 30px;
  border-radius: 24px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 85, 247, 0.2);
  position: relative;
  overflow: hidden;
}

.admin-icon {
  width: 70px;
  height: 70px;
  background: rgba(168, 85, 247, 0.12);
  border: 2px solid var(--primary-purple);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 28px;
  color: var(--primary-purple);
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
}

.login-card h2 {
  background: linear-gradient(135deg, #c084fc, var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  font-size: 24px;
  font-weight: 800;
}

.login-card p {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 25px;
}

.input-group {
  position: relative;
  margin-bottom: 18px;
}

.input-group i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
  transition: color 0.3s ease;
}

input {
  width: 100%;
  padding: 14px 16px 14px 45px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  color: white;
  outline: none;
  font-size: 15px;
  transition: all 0.3s ease;
}

input:focus {
  border-color: var(--primary-purple);
  box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
  background: rgba(255, 255, 255, 0.07);
}

input:focus + i {
  color: var(--primary-purple);
}

.btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #9333ea, #6366f1);
  border: none;
  border-radius: 14px;
  color: white;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 20px rgba(147, 51, 234, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 25px rgba(147, 51, 234, 0.5);
}

.error-msg {
  color: var(--error-red);
  margin-top: 15px;
  font-size: 13px;
  display: none;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  padding: 10px;
  border-radius: 10px;
  animation: shake 0.3s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
</style>
</head>
<body>

<div class="login-card">
  <div class="admin-icon">
    <i class="fa-solid fa-user-shield"></i>
  </div>
  <h2>Admin Panel</h2>
  <p>Tizimga kirish uchun maxfiy parolni kiriting</p>

  <form id="login-form">
    <div class="input-group">
      <input type="password" id="admin-pass" placeholder="Parol..." required autocomplete="current-password">
      <i class="fa-solid fa-lock"></i>
    </div>
    <button type="submit" class="btn">
      <span>Kirish</span>
      <i class="fa-solid fa-arrow-right-to-bracket"></i>
    </button>
  </form>

  <div id="error-text" class="error-msg">
    <i class="fa-solid fa-circle-exclamation"></i> Noto'g'ri parol! Qayta urinib ko'ring.
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const pass = document.getElementById('admin-pass').value.trim();
  const errorText = document.getElementById('error-text');

  // MAXFIY PAROL: honorx7b
  if (pass === 'honorx7b') {
    // Brauzer xotirasiga admin holatini saqlash
    localStorage.setItem('isAdmin', 'true');
    sessionStorage.setItem('huquq_admin_auth', 'active');
    
    // Muvaffaqiyatli xabar va yo'naltirish
    errorText.style.display = 'none';
    
    // Boshqa yashirin admin panelingiz sahifasiga yo'naltirish
    window.location.href = 'admin.html'; 
  } else {
    errorText.style.display = 'block';
    document.getElementById('admin-pass').value = '';
    document.getElementById('admin-pass').focus();
  }
});
</script>

</body>
</html>
