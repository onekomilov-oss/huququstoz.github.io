<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huquq Ustoz | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet yo'llari to'g'rilandi -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html">
        <img src="huquq.jpg" alt="Huquq Ustoz Logo">
        <h2>Huquq Ustoz</h2>
      </a>
      <div class="social">
        <a href="index.html">Bosh sahifa</a>
        <a href="quiz.html">Quiz</a>
        <a href="admin.html" class="active">Admin Panel</a>
      </div>
    </div>
  </header>

  <main class="admin-container">
    <h1>Admin Panel</h1>

    <div class="admin-section">
      <h2>Yangi Toifa Qo'shish</h2>
      <div class="form-group">
        <input type="text" id="new-category-name" placeholder="Toifa nomini kiriting">
        <button class="btn btn-primary" onclick="addNewCategory()">Toifa Qo'shish</button>
      </div>
    </div>

    <div class="admin-section">
      <h2>Yangi Savol Qo'shish</h2>
      <div class="form-group">
        <select id="category-select">
          <option value="" disabled selected>Toifa tanlang</option>
        </select>
        <input type="text" id="new-question-text" placeholder="Savol matnini kiriting">
        <select id="question-type">
          <option value="variant">Variantli savol</option>
          <option value="boolean">Ha/Yoq savol</option>
        </select>
        <div id="variants-container">
          <input type="text" class="variant-input" placeholder="Variant A">
          <input type="text" class="variant-input" placeholder="Variant B">
          <input type="text" class="variant-input" placeholder="Variant C">
          <input type="text" class="variant-input" placeholder="Variant D">
        </div>
        <div id="boolean-container" style="display: none;">
          <p>To'g'ri javob: <select id="boolean-answer">
            <option value="true">Ha</option>
            <option value="false">Yo'q</option>
          </select></p>
        </div>
        <div id="variant-answer-container">
          <select id="variant-answer">
            <option value="0">Variant A</option>
            <option value="1">Variant B</option>
            <option value="2">Variant C</option>
            <option value="3">Variant D</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="addNewQuestion()">Savol Qo'shish</button>
      </div>
    </div>

    <div class="admin-section">
      <h2>Toifalar va Savollar</h2>
      <div id="categories-list"></div>
    </div>

    <div class="admin-section">
      <h2>Ma'lumotlarni Saqlash</h2>
      <button class="btn btn-primary" onclick="saveData()">Ma'lumotlarni Saqlash</button>
      <button class="btn btn-secondary" onclick="loadData()">Ma'lumotlarni Yangilash</button>
    </div>
  </main>

  <footer>
    &copy; 2026 Huquq Ustoz. Barcha huquqlar himoyalangan.
  </footer>

  <!-- Script yo'li to'g'rilandi -->
  <script src="scripts/admin.js"></script>
</body>
</html>
