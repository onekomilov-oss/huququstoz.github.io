<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Huquq Ustoz</title>
<link rel="icon" type="image/jpeg" href="huquq.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
body{ background:#0f172a; color:white; min-height:100vh; display:flex; flex-direction:column; }
header{ position:sticky; top:0; background:#111827; padding:15px 0; border-bottom:1px solid #333; z-index:10; }
.container{ width:90%; max-width:1100px; margin:auto; }
.nav{ display:flex; justify-content:space-between; align-items:center; }
.logo{ display:flex; align-items:center; gap:12px; text-decoration:none; }
.logo img{ width:55px; height:55px; border-radius:50%; object-fit:cover; }
.logo h2{ color:#a855f7; font-size:24px; }
.logout-btn{ background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold; transition:.3s; }
.logout-btn:hover{ background:#dc2626; }

main{ flex:1; padding:30px 0; }
.tab-buttons{ display:flex; gap:10px; margin-bottom:25px; flex-wrap:wrap; }
.tab-btn{ background:#1f2937; color:white; border:1px solid #444; padding:12px 20px; border-radius:8px; cursor:pointer; font-weight:bold; transition:.3s; }
.tab-btn.active, .tab-btn:hover{ background:#7c3aed; border-color:#7c3aed; }

.tab-content{ display:none; }
.tab-content.active{ display:block; }

.admin-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.card{ background:#111827; border:1px solid #333; border-radius:12px; padding:25px; margin-bottom:20px; }
.card h2{ color:#a855f7; margin-bottom:15px; font-size:20px; border-bottom:1px solid #333; padding-bottom:10px; }

.form-group{ margin-bottom:15px; }
.form-group label{ display:block; margin-bottom:5px; color:#cbd5e1; font-size:14px; }
input, select, textarea{ width:100%; padding:10px; background:#1f2937; border:1px solid #444; color:white; border-radius:8px; outline:none; font-size:14px; }
textarea{ resize:vertical; min-height:80px; }
input:focus, select:focus, textarea:focus{ border-color:#a855f7; }

/* TO'G'RI JAVOBNI BELGILASH DUMALOQ RADIO TUGMALARI VA STILLAR */
.options-wrapper { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.option-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1f2937;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #444;
  transition: 0.2s ease-in-out;
}
.option-row.correct-selected {
  border-color: #10b981;
  background: rgba(16, 185, 129, 0.12);
}
.radio-box {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.radio-box input[type="radio"] {
  appearance: none;
  width: 22px;
  height: 22px;
  border: 2px solid #9ca3af;
  border-radius: 50%;
  outline: none;
  cursor: pointer;
  position: relative;
  transition: 0.2s;
}
.radio-box input[type="radio"]:checked {
  border-color: #10b981;
  background-color: #10b981;
}
.radio-box input[type="radio"]:checked::after {
  content: '✓';
  position: absolute;
  color: white;
  font-size: 13px;
  font-weight: bold;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.opt-prefix { font-weight: bold; color: #a855f7; width: 20px; }

.btn{ padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; border:none; color:white; transition:.3s; }
.btn-primary{ background:#7c3aed; }
.btn-primary:hover{ background:#6d28d9; }
.btn-success{ background:#10b981; }
.btn-success:hover{ background:#059669; }

footer{ padding:25px 0; border-top:1px solid #333; background:#0f172a; color:#9ca3af; margin-top:auto; }

@media(max-width:768px){
  .admin-grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a href="index.html" class="logo">
      <img src="huquq.jpg" alt="Huquq Ustoz Logo">
      <h2>Huquq Ustoz Admin</h2>
    </a>
    <button class="logout-btn" id="logout-btn">Chiqish</button>
  </div>
</header>

<main class="container">
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('quiz-tab', this)">📝 Testlarni Boshqarish</button>
    <button class="tab-btn" onclick="switchTab('bio-tab', this)">👤 Bio / Sayt Matnlarini O'zgartirish</button>
  </div>

  <div id="quiz-tab" class="tab-content active">
    <div class="admin-grid">
      <div>
        <div class="card">
          <h2>1. Yangi Toifa Qo'shish</h2>
          <div class="form-group">
            <input type="text" id="cat-name-input" placeholder="Masalan: 10-Sinf Huquq">
          </div>
          <button class="btn btn-primary" id="add-cat-btn">Toifa Qo'shish</button>
        </div>

        <div class="card">
          <h2>2. Yangi Savol Qo'shish</h2>
          <div class="form-group">
            <label>Toifani tanlang:</label>
            <select id="admin-cat-select"><option value="">Tanlang...</option></select>
          </div>
          <div class="form-group">
            <label>Savol matni:</label>
            <input type="text" id="q-text-input" placeholder="Savolni kiriting...">
          </div>
          <div class="form-group">
            <label>Savol turi:</label>
            <select id="q-type-select" onchange="toggleQType(this.value)">
              <option value="variant">4 ta Variantli</option>
              <option value="boolean">Ha / Yo'q (Rost/Yolg'on)</option>
            </select>
          </div>

          <!-- VARIANTLAR VA TO'G'RI JAVOBNI TANLASH NUKTALARI -->
          <div id="variant-inputs">
            <label style="color:#cbd5e1; font-size:13px; margin-bottom:8px; display:block;">
              📌 Variantlarni kiriting va <b>to'g'ri javob yonidagi doirani belgilang</b>:
            </label>
            
            <div class="options-wrapper">
              <!-- A Variant -->
              <div class="option-row correct-selected" id="opt-row-0">
                <label class="radio-box" title="To'g'ri javob sifatida belgilash">
                  <input type="radio" name="correctVariant" value="0" checked onclick="markCorrect(0)">
                </label>
                <span class="opt-prefix">A)</span>
                <input type="text" class="v-inp" placeholder="A Variant matni">
              </div>

              <!-- B Variant -->
              <div class="option-row" id="opt-row-1">
                <label class="radio-box" title="To'g'ri javob sifatida belgilash">
                  <input type="radio" name="correctVariant" value="1" onclick="markCorrect(1)">
                </label>
                <span class="opt-prefix">B)</span>
                <input type="text" class="v-inp" placeholder="B Variant matni">
              </div>

              <!-- C Variant -->
              <div class="option-row" id="opt-row-2">
                <label class="radio-box" title="To'g'ri javob sifatida belgilash">
                  <input type="radio" name="correctVariant" value="2" onclick="markCorrect(2)">
                </label>
                <span class="opt-prefix">C)</span>
                <input type="text" class="v-inp" placeholder="C Variant matni">
              </div>

              <!-- D Variant -->
              <div class="option-row" id="opt-row-3">
                <label class="radio-box" title="To'g'ri javob sifatida belgilash">
                  <input type="radio" name="correctVariant" value="3" onclick="markCorrect(3)">
                </label>
                <span class="opt-prefix">D)</span>
                <input type="text" class="v-inp" placeholder="D Variant matni">
              </div>
            </div>
          </div>

          <!-- HA / YO'Q SAVOL KIRITISH -->
          <div id="boolean-inputs" style="display:none; margin-top:15px;">
            <div class="form-group">
              <label>To'g'ri Javob:</label>
              <select id="bool-ans">
                <option value="true">Ha (To'g'ri)</option>
                <option value="false">Yo'q (Noto'g'ri)</option>
              </select>
            </div>
          </div>

          <button class="btn btn-primary" id="add-q-btn" style="margin-top:18px; width:100%;">Savol Qo'shish</button>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>3. Savollar va Toifalar Ro'yxati</h2>
          <div id="categories-list"></div>
          <button class="btn btn-success" id="download-json-btn" style="width:100%; margin-top:15px;">
            💾 Yangilangan "savollar.json" Faylini Yuklab Olish
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="bio-tab" class="tab-content">
    <div class="card" style="max-width:700px; margin:auto;">
      <h2>Bosh Sahifa Ma'lumotlarini Tahrirlash</h2>
      <div class="form-group">
        <label>Sarlavha (Hero Header):</label>
        <input type="text" id="hero-title-input" placeholder="Huquqiy bilim sari birgalikda">
      </div>
      <div class="form-group">
        <label>Asosiy Kirish Matni (Hero Text):</label>
        <textarea id="hero-desc-input" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>"Men haqimda" Sarlavhasi:</label>
        <input type="text" id="about-title-input" placeholder="Men haqimda">
      </div>
      <div class="form-group">
        <label>"Men haqimda" Matni:</label>
        <textarea id="about-desc-input" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>Telegram Kanal Havolasi:</label>
        <input type="text" id="tg-link-input" placeholder="https://t.me/huququstoz">
      </div>
      <div class="form-group">
        <label>Instagram Sahifa Havolasi:</label>
        <input type="text" id="insta-link-input" placeholder="https://instagram.com/huququstoz">
      </div>
      <button class="btn btn-primary" id="save-bio-btn" style="width:100%;">Saqlash (Brauzer xotirasiga)</button>
    </div>
  </div>
</main>

<footer>
  <div class="container" style="text-align:center;">
    <p>© 2026 Huquq Ustoz. Admin Boshqaruv Tizimi.</p>
  </div>
</footer>

<script>
function switchTab(tabId, element) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  element.classList.add('active');
}

function toggleQType(type) {
  const vInp = document.getElementById('variant-inputs');
  const bInp = document.getElementById('boolean-inputs');
  if (type === 'boolean') {
    vInp.style.display = 'none';
    bInp.style.display = 'block';
  } else {
    vInp.style.display = 'block';
    bInp.style.display = 'none';
  }
}

// Qaysi radio-tugma bosilsa, yashil chegarani o'shanga o'tkazish
function markCorrect(selectedIndex) {
  for (let i = 0; i < 4; i++) {
    const row = document.getElementById(`opt-row-${i}`);
    if (i === selectedIndex) {
      row.classList.add('correct-selected');
    } else {
      row.classList.remove('correct-selected');
    }
  }
}
</script>
<script src="scripts/app.js"></script>
</body>
</html>
